plugins {
    id 'fabric-loom' version '1.17.20'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Deux dependances douces, pour le HUD seulement : la classe du joueur vient du
    // noyau RPG, le niveau de Pufferfish Skills. Compilation seule, depuis les jars
    // reellement installes sur le serveur — aucun des deux n'est publie sur un depot
    // Maven. Les ponts (package `bridge`) ne les appellent que si le mod est charge,
    // et se coupent d'eux-memes a la premiere erreur de liaison.
    // Loom remappe ces jars (intermediary -> yarn) parce qu'ils sont declares en `mod...`.
    modCompileOnly files("libs/haute-capitale-rpg-0.1.0.jar")
    modCompileOnly files("libs/puffish_skills-0.17.3-1.21.11-fabric.jar")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java { withSourcesJar() }

// --- Harnais de verification -------------------------------------------------
// PartyTest est un main() classique, pas du JUnit : la tache `test` de Gradle
// echouerait sur « no tests discovered ». On la desactive et on branche le
// harnais sur `check`, pour qu'un `build` ne passe jamais avec un codec casse
// ou une regle de vote fausse.
sourceSets {
    test { compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
           runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output }
}

tasks.register('runPartyTest', JavaExec) {
    group = 'verification'
    description = 'Verifie le modele de groupe, les codecs de sauvegarde et les regles sociales.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.hautecapitale.party.PartyTest'
    defaultCharacterEncoding = 'UTF-8'
}

tasks.named('test') { enabled = false }
tasks.named('check') { dependsOn 'runPartyTest' }
