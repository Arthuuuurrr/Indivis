plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

repositories {
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
	}
}

base { archivesName = 'haute_capitale_fusils' }

loom {
	mods {
		"haute_capitale_fusils" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Rendu anime des armes (modeles, animations, bras a la premiere personne).
	modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

	implementation "com.google.code.findbugs:jsr305:3.0.2"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Generateur d'assets originaux (modeles, animations, textures) : tools/AssetGen.java
tasks.register('genAssets', JavaExec) {
	group = 'build'
	description = 'Regenere les modeles geo, animations et textures des armes.'
	classpath = files('tools/out')
	mainClass = 'AssetGen'
	args = [file('src/main/resources').absolutePath]
}
