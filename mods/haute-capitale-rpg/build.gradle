plugins {
    id 'fabric-loom' version '1.17.20'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Spell Engine : compilation seulement. Le noyau se charge sans lui — le verrou
    // de sorts ne s'enregistre que si le mod est présent (voir SpellLock).
    // `transitive = false` : on ne veut que ses classes pour compiler, pas sa chaîne
    // de dépendances (spell_power, tiny-config, cardinal-components) qui n'est pas
    // résolvable ici et ne sert à rien pour une compilation seule.
    modCompileOnly("net.spell_engine:spell_engine-fabric:${project.spell_engine_version}") { transitive = false }

    // Pufferfish Skills : compilation seulement, depuis le JAR reellement installe sur
    // le serveur — il n'est publie sur aucun depot Maven. Tous droits reserves : on
    // appelle son API publique, on n'embarque ni ne recopie son code.
    // Loom remappe le JAR (intermediary -> yarn) parce qu'il est declare en `mod...`.
    modCompileOnly files("libs/puffish_skills-0.17.3-1.21.11-fabric.jar")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java { withSourcesJar() }

// --- Harnais de verification -------------------------------------------------
// NoyauTest est un main() classique, pas du JUnit : la tache `test` de Gradle
// echouerait sur « no tests discovered ». On la desactive et on branche notre
// harnais sur `check`, pour qu'un `build` ne passe jamais avec un codec casse.
sourceSets {
    test { compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
           runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output }
}

tasks.register('runNoyauTest', JavaExec) {
    group = 'verification'
    description = 'Verifie les classes, les codecs de sauvegarde et l alignement des ecoles.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.hautecapitale.rpg.NoyauTest'
}

tasks.named('test') { enabled = false }
tasks.named('check') { dependsOn 'runNoyauTest' }

// --- Client de verification --------------------------------------------------
// Entre directement dans le monde "coretest" : le scenario de la sonde a besoin
// d'un vrai joueur, ce que la console d'un serveur ne fournit pas.
loom {
    runConfigs {
        client {
            programArgs("--quickPlaySingleplayer", "coretest")
            // Autotest camera en jeu : ./gradlew runClient -PcameraSelfTest
            // Le client entre dans le monde, mesure la camera, et s'arrete seul.
            if (project.hasProperty("cameraSelfTest")) {
                vmArgs("-Dhcrpg.camera.selftest=true")
            }
        }
    }
}

tasks.register('runCapacitesTest', JavaExec) {
    group = 'verification'
    description = 'Verifie les codecs et les valeurs par defaut des definitions de capacites.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.hautecapitale.rpg.CapacitesTest'
}
tasks.named('check') { dependsOn 'runCapacitesTest' }

tasks.register('runCameraTest', JavaExec) {
    group = 'verification'
    description = 'Verifie la suspension pendant les cinematiques, le lissage et la projection du reticule.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.hautecapitale.rpg.CameraTest'
}
tasks.named('check') { dependsOn 'runCameraTest' }
