plugins {
    id 'fabric-loom' version '1.17.20'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

// Le code client vit dans son propre source set. Sur un serveur dédié il n'est
// même pas présent : aucune classe d'interface ne peut y être chargée par
// accident, ce qui est la seule garantie solide contre un crash de serveur.
loom {
    splitEnvironmentSourceSets()

    mods {
        "haute_capitale_metiers" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    // Serveur et client de test tournent en même temps, chacun dans son dossier.
    // Partager `run/` les fait se disputer le cache des jars remappés
    // (`.fabric/remappedJars`) : sous Windows, le second à démarrer ne peut
    // pas réécrire un fichier que le premier tient ouvert, et s'arrête net.
    runs {
        client {
            runDir "run-client"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Easy NPC (MIT, Markus Bordihn) — dépendance seulement. Le mod n'est ni
    // modifié ni redistribué : le jar reste dans `libs/` et n'entre pas dans le
    // nôtre. Version alignée sur celle installée sur le serveur.
    modImplementation files("libs/${project.easynpc_jar}")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
    it.options.compilerArgs << "-Xlint:deprecation"
}

java {
    withSourcesJar()
}

// Harnais de test de la logique pure du socle (sans serveur ni joueur).
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

tasks.register('runSocleTest', JavaExec) {
    group = 'verification'
    description = 'Exécute les tests de logique pure du socle.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.hautecapitale.metiers.SocleTest'
    defaultCharacterEncoding = 'UTF-8'
}

tasks.register('runDonneesTest', JavaExec) {
    group = 'verification'
    description = 'Exécute les tests du moteur de données (fiches, validation, clés).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.hautecapitale.metiers.data.DonneesTest'
    defaultCharacterEncoding = 'UTF-8'
    dependsOn 'processResources'
}

// Les harnais ne sont pas du JUnit : on désactive la tâche standard et on
// accroche les nôtres au cycle de vérification, pour que « gradle build » teste.
tasks.named('test') {
    enabled = false
}
tasks.named('check') {
    dependsOn 'runSocleTest', 'runDonneesTest'
}
