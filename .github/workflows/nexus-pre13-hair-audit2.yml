name: Nexus PRE13 hair asset audit 2

on:
  push:
    paths:
      - ".github/workflows/nexus-pre13-hair-audit2.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Audit hair UV occupancy
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE12.jar"
          mkdir -p /tmp/hair
          for kind in short long; do
            max=5
            [ "$kind" = "long" ] && max=8
            for raw in $(seq 1 $max); do
              n=$(printf "%02d" "$raw")
              unzip -p "$J" "assets/nexuscharacters/appearance_parts_v064/hair/hair_${kind}_${n}.png" > "/tmp/hair/${kind}_${n}.png"
            done
          done
          cat >/tmp/HairAudit.java <<'JAVA'
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;

          public final class HairAudit {
            static int count(BufferedImage i,int x0,int y0,int x1,int y1){
              int c=0; for(int y=y0;y<y1;y++) for(int x=x0;x<x1;x++) if(((i.getRGB(x,y)>>>24)&255)!=0)c++; return c;
            }
            public static void main(String[] args)throws Exception{
              for(String kind:new String[]{"short","long"}){
                int max=kind.equals("long")?8:5;
                for(int n=1;n<=max;n++){
                  BufferedImage i=ImageIO.read(new File(String.format("/tmp/hair/%s_%02d.png",kind,n)));
                  int headBase=count(i,0,0,32,16);
                  int headOuter=count(i,32,0,64,16);
                  int torsoBase=count(i,16,16,40,32);
                  int torsoOuter=count(i,16,32,40,48);
                  int rest=count(i,0,0,64,64)-headBase-headOuter-torsoBase-torsoOuter;
                  System.out.printf("%s_%02d headBase=%d headOuter=%d torsoBase=%d torsoOuter=%d rest=%d%n",
                    kind,n,headBase,headOuter,torsoBase,torsoOuter,rest);
                }
              }
            }
          }
          JAVA
          javac /tmp/HairAudit.java
          java -cp /tmp HairAudit
