name: Build NexusCharacters PRE20
on:
  push:
    branches: [fix/nexus-pre20-native-voxel-render]
    paths:
      - mods/nexuscharacters/reference/BETA-1.0-PRE20/**
      - .github/workflows/build-nexus-pre20.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /.gitattributes
            /mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE19.jar
            /mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE20.jar
            /mods/nexuscharacters/reference/BETA-1.0-PRE20/
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile corrected renderer and assemble JAR
        run: |
          task_root=mods/nexuscharacters/reference/BETA-1.0-PRE20
          base_jar=mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE19.jar
          git lfs pull --include="$base_jar" --exclude=""
          mkdir -p "$task_root/classes"
          javac -cp "$base_jar" -d "$task_root/classes" "$task_root/sources/GenericSkinLayerSupport.java" "$task_root/sources/GenericLayerPixels.java"
          python "$task_root/assemble.py" "$base_jar" artifacts/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE20.jar
          echo '274629caa578331de80e69fda7a6830518da22f6ecf80e7742ca8aa5e3d66dd4  artifacts/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE20.jar' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: NexusCharacters-PRE20
          path: artifacts/*.jar
          retention-days: 90
      - name: Preserve the verified binary on the correction branch
        run: |
          cp artifacts/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE20.jar mods/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE20.jar
          if ! git diff --cached --quiet; then
            git commit -m 'Store verified NexusCharacters PRE20 binary'
            git push origin HEAD:fix/nexus-pre20-native-voxel-render
          fi
