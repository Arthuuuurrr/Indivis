name: Nexus PRE13 inspect

on:
  push:
    paths:
      - ".github/workflows/nexus-pre13-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Inspect PRE12 renderer and Skin Layers API
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE12.jar"
          curl -fsSL https://www.benf.org/other/cfr/cfr-0.152.jar -o /tmp/cfr.jar
          mkdir -p /tmp/d
          java -jar /tmp/cfr.jar "$J" --outputdir /tmp/d --silent true >/dev/null 2>&1

          for f in             /tmp/d/net/tompsen/nexuscharacters/CharacterCosmeticFeatureRenderer.java             /tmp/d/net/tompsen/nexuscharacters/LongHair3DRenderSupport.java             /tmp/d/net/tompsen/nexuscharacters/CosmeticRenderStateAccess.java             /tmp/d/net/tompsen/nexuscharacters/mixin/client/LivingEntityCosmeticRenderMixin.java             /tmp/d/net/tompsen/nexuscharacters/mixin/client/PlayerCosmeticStateMixin.java; do
            echo "===== $f ====="
            [ -f "$f" ] && cat "$f"
          done

          SKIN="$(find mods -maxdepth 2 -iname 'skinlayers3d*1.10.2*1.21.11*.jar' | head -n1 || true)"
          echo "SKIN=$SKIN"
          if [ -n "$SKIN" ]; then
            echo "=== SKIN API ==="
            javap -classpath "$SKIN" -p dev.tr7zw.skinlayers.api.Mesh dev.tr7zw.skinlayers.api.MeshHelper dev.tr7zw.skinlayers.api.OffsetProvider dev.tr7zw.skinlayers.accessor.ModelPartInjector || true
            echo "=== SKIN LAYER RENDER PATH ==="
            java -jar /tmp/cfr.jar "$SKIN" --outputdir /tmp/sd --silent true >/dev/null 2>&1
            grep -RniE -C 6 'setInjectedMesh|create3DMesh|bodyMesh|jacket|method_73492|render' /tmp/sd/dev/tr7zw/skinlayers | head -n 1800 || true
          fi
