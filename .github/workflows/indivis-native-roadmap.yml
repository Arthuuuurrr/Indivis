name: Indivis Native Roadmap

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/indivis-native-roadmap.yml"

permissions:
  contents: read
  issues: write

jobs:
  build-native-roadmap:
    runs-on: ubuntu-latest

    steps:
      - name: Create milestones and assign roadmap issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"

          ensure_milestone() {
            local title="$1"
            local description="$2"
            local due_on="$3"
            local existing number

            existing="$(gh api "repos/${REPO}/milestones?state=all&per_page=100")"
            number="$(jq -r --arg title "$title" '.[] | select(.title == $title) | .number' <<<"$existing" | head -n1)"

            if [[ -z "$number" ]]; then
              echo "Creating milestone: $title" >&2
              number="$(jq -nc \
                --arg title "$title" \
                --arg description "$description" \
                --arg due_on "$due_on" \
                '{title:$title,description:$description,due_on:$due_on}' | \
                gh api --method POST "repos/${REPO}/milestones" --input - --jq '.number')"
            else
              echo "Reusing milestone #$number: $title" >&2
              jq -nc \
                --arg title "$title" \
                --arg description "$description" \
                --arg due_on "$due_on" \
                '{title:$title,description:$description,due_on:$due_on}' | \
                gh api --method PATCH "repos/${REPO}/milestones/${number}" --input - >/dev/null
            fi

            printf '%s' "$number"
          }

          assign_issue() {
            local issue="$1"
            local milestone="$2"

            if ! gh api "repos/${REPO}/issues/${issue}" >/dev/null 2>&1; then
              echo "Issue #$issue does not exist; skipping"
              return 0
            fi

            jq -nc --argjson milestone "$milestone" '{milestone:$milestone}' | \
              gh api --method PATCH "repos/${REPO}/issues/${issue}" --input - >/dev/null
          }

          M0="$(ensure_milestone \
            "0 — Validation technique" \
            "Stabilisation avant développement supplémentaire : versions serveur/client, Spell Engine, Spell Power, Nexus, créatures, HUD et validations runtime. Échéance indicative." \
            "2026-10-19T23:59:59Z")"

          M1="$(ensure_milestone \
            "1 — Progression & combat" \
            "Socle gameplay : CapSkills, sorts, armes, armures, combat, équilibrage et intégrations associées. Échéance indicative." \
            "2026-11-07T23:59:59Z")"

          M2="$(ensure_milestone \
            "2 — Monde & biomes" \
            "Monde jouable : référentiel culturel, biomes, villes, zones sûres, spawns et cohérence environnementale. Échéance indicative." \
            "2026-11-24T23:59:59Z")"

          M3="$(ensure_milestone \
            "3 — Quêtes & narration" \
            "Progression narrative : prologue, Bas-Anneaux, quêtes de la capitale, choix et corrections de progression. Échéance indicative." \
            "2026-12-24T23:59:59Z")"

          M4="$(ensure_milestone \
            "4 — Donjons & boss" \
            "Donjons, boss, loot, progression PvE et correctifs associés. Échéance indicative." \
            "2027-01-08T23:59:59Z")"

          M5="$(ensure_milestone \
            "5 — Contenu bêta & finition" \
            "Contenu secondaire et finition de la bêta : construction, polish, housing, montures, langues et compléments. Échéance indicative." \
            "2027-02-27T23:59:59Z")"

          for n in 83 75 70 7 58 78 56 57 60 61 62 66; do assign_issue "$n" "$M0"; done
          for n in 53 3 4 5 6 18 2 15 16 49 14 50 19 48; do assign_issue "$n" "$M1"; done
          for n in 43 35 52 38 47 10 39 24; do assign_issue "$n" "$M2"; done
          for n in 63 64 65 8 9 20 21 25 26 59 33; do assign_issue "$n" "$M3"; done
          for n in 32 51 11 12 13 46 28 23 22; do assign_issue "$n" "$M4"; done
          for n in 34 37 40 45 27 29 30 31 36 41 42 44; do assign_issue "$n" "$M5"; done

          milestone_url() {
            local number="$1"
            printf 'https://github.com/%s/milestone/%s' "$REPO" "$number"
          }

          ROADMAP_TITLE="ROADMAP — Indivis"
          existing_roadmap="$(gh issue list --repo "$REPO" --state all --limit 200 --json number,title \
            --jq ".[] | select(.title == \"$ROADMAP_TITLE\") | .number" | head -n1)"

          BODY_FILE="$(mktemp)"
          cat >"$BODY_FILE" <<EOF
          # Roadmap Indivis

          Cette Issue est le point d'entrée de la roadmap native GitHub.

          ## Phases

          - [Phase 0 — Validation technique]($(milestone_url "$M0")) — priorité aux validations et blocages techniques.
          - [Phase 1 — Progression & combat]($(milestone_url "$M1")) — skills, spells, armes, armures et combat.
          - [Phase 2 — Monde & biomes]($(milestone_url "$M2")) — monde, biomes, villes et spawns.
          - [Phase 3 — Quêtes & narration]($(milestone_url "$M3")) — prologue, Bas-Anneaux et narration.
          - [Phase 4 — Donjons & boss]($(milestone_url "$M4")) — PvE, boss, donjons et loot.
          - [Phase 5 — Contenu bêta & finition]($(milestone_url "$M5")) — contenu secondaire et polish.

          ## Priorités

          La priorité reste pilotée avec les labels déjà présents dans le dépôt :

          - **P1** — `Priorité maximale -P1`
          - **P2** — `Problème prioritaire secondaire -P2`
          - **P3** — `A régler -P3`
          - **P4** — `A traiter -P4`

          Le préfixe **P0** reste réservé aux urgences explicitement indiquées dans le titre.

          ## Utilisation

          - Pour changer une tâche de phase : ouvrir l'Issue et modifier **Milestone**.
          - Pour changer sa priorité : modifier son label P1/P2/P3/P4.
          - Pour indiquer qu'elle est terminée : fermer l'Issue.
          - Les pages Milestones calculent automatiquement le pourcentage d'avancement.
          - Les dates des milestones sont des **repères indicatifs**, pas des deadlines contractuelles.

          Cette roadmap remplace le GitHub Project V2 actuellement inutilisable à cause de son index d'items incohérent.
          EOF

          if [[ -z "$existing_roadmap" ]]; then
            echo "Creating roadmap dashboard issue"
            gh issue create --repo "$REPO" --title "$ROADMAP_TITLE" --body-file "$BODY_FILE" >/dev/null
          else
            echo "Updating roadmap dashboard issue #$existing_roadmap"
            gh issue edit "$existing_roadmap" --repo "$REPO" --body-file "$BODY_FILE" >/dev/null
          fi

          echo "Native roadmap ready:"
          echo "https://github.com/${REPO}/milestones"
