name: Nexus PRE14 forensic verification

on:
  push:
    paths:
      - ".github/workflows/nexus-pre14-forensic.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download exact Skin Layers 1.10.2 1.21.11 release
        shell: bash
        run: |
          curl -fL --retry 3             "https://github.com/tr7zw/3d-Skin-Layers/releases/download/1.10.2/skinlayers3d-fabric-1.10.2-mc1.21.11.jar"             -o /tmp/skinlayers.jar
          echo "SkinLayers size=$(stat -c%s /tmp/skinlayers.jar)"
          sha256sum /tmp/skinlayers.jar
          test "$(sha256sum /tmp/skinlayers.jar | awk '{print $1}')" =             "736f076b9f45bab1c118166857f46729f782ddd481a0e4e4ee0bc110643f2756"

      - name: Verify exact Skin Layers runtime ABI
        shell: bash
        run: |
          echo "=== MeshHelper ==="
          javap -classpath /tmp/skinlayers.jar -p dev.tr7zw.skinlayers.api.MeshHelper
          echo "=== OffsetProvider ==="
          javap -classpath /tmp/skinlayers.jar -p -c dev.tr7zw.skinlayers.api.OffsetProvider
          echo "=== ModelPartInjector ==="
          javap -classpath /tmp/skinlayers.jar -p dev.tr7zw.skinlayers.accessor.ModelPartInjector
          echo "=== SkinLayersAPI ==="
          javap -classpath /tmp/skinlayers.jar -p dev.tr7zw.skinlayers.api.SkinLayersAPI
          echo "=== ModelPartMixin ==="
          javap -classpath /tmp/skinlayers.jar -p -c dev.tr7zw.skinlayers.mixin.ModelPartMixin
          echo "=== SkinUtil ==="
          javap -classpath /tmp/skinlayers.jar -p -c dev.tr7zw.skinlayers.SkinUtil

          # Exact intermediary names PRE14 reflects against.
          javap -classpath /tmp/skinlayers.jar -p -c dev.tr7zw.skinlayers.api.OffsetProvider             | grep -E 'method_22905|method_22904|field_'
          javap -classpath /tmp/skinlayers.jar -p -c dev.tr7zw.skinlayers.mixin.ModelPartMixin             | grep -E 'method_22703|method_22903|method_22909'

      - name: Decompile exact PRE14 and compare renderer call contracts
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE14.jar"
          test "$(sha256sum "$J" | awk '{print $1}')" =             "d63ac9ac90ebe9e71eee3e4ca77f34fca12e32c90a645bb07f97fed3adaa8034"

          curl -fsSL https://www.benf.org/other/cfr/cfr-0.152.jar -o /tmp/cfr.jar
          mkdir -p /tmp/nexus
          java -jar /tmp/cfr.jar "$J" --outputdir /tmp/nexus --silent true >/dev/null 2>&1

          echo "=== PRE14 LongHair3DRenderSupport ==="
          cat /tmp/nexus/net/tompsen/nexuscharacters/LongHair3DRenderSupport.java

          echo "=== CharacterCosmeticFeatureRenderer direct queue/render calls ==="
          grep -n -C 12 -E 'method_73492|method_75982|method_23622|method_17165|method_22703'             /tmp/nexus/net/tompsen/nexuscharacters/CharacterCosmeticFeatureRenderer.java || true

          echo "=== DynamicAppearanceSupport hair path ==="
          grep -n -C 10 -E 'hairName|overlayTinted|LongHair3DRenderSupport'             /tmp/nexus/net/tompsen/nexuscharacters/DynamicAppearanceSupport.java || true

          echo "=== Preview/render state cosmetic path ==="
          for f in             /tmp/nexus/net/tompsen/nexuscharacters/mixin/client/PlayerCosmeticStateMixin.java             /tmp/nexus/net/tompsen/nexuscharacters/mixin/client/PreviewDummyCosmeticMixin.java             /tmp/nexus/net/tompsen/nexuscharacters/mixin/client/CharacterPreviewCosmeticContextMixin.java; do
            echo "FILE=$f"
            [ -f "$f" ] && cat "$f"
          done

      - name: Compare PRE14 reflective queue call with known working beard call
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE14.jar"
          echo "=== Direct method_73492 descriptors in existing compiled renderer ==="
          javap -classpath "$J" -p -c -s net.tompsen.nexuscharacters.CharacterCosmeticFeatureRenderer             | grep -A8 -B12 'method_73492'

          echo "=== PRE14 reflected submit logic ==="
          javap -classpath "$J" -p -c -s net.tompsen.nexuscharacters.LongHair3DRenderSupport             | grep -A150 'submitPart'

      - name: Validate all PRE14 dedicated hair assets and overlap removal
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE14.jar"
          rm -rf /tmp/audit && mkdir -p /tmp/audit
          cat >/tmp/ForensicHair.java <<'JAVA'
          import java.awt.image.BufferedImage;
          import java.io.*;
          import java.util.zip.*;
          import javax.imageio.ImageIO;

          public final class ForensicHair {
            static BufferedImage read(ZipFile z,String n)throws Exception{
              try(InputStream in=z.getInputStream(z.getEntry(n))){return ImageIO.read(in);}
            }
            static int count(BufferedImage i,int x0,int y0,int x1,int y1){
              int c=0;for(int y=y0;y<y1;y++)for(int x=x0;x<x1;x++)
                if(((i.getRGB(x,y)>>>24)&255)!=0)c++;return c;
            }
            public static void main(String[]a)throws Exception{
              try(ZipFile z=new ZipFile(a[0])){
                for(int h=1;h<=13;h++){
                  String mesh=String.format("assets/nexuscharacters/textures/cosmetic/hair_3d/hair_%02d.png",h);
                  BufferedImage m=read(z,mesh);
                  if(m==null||m.getWidth()!=64||m.getHeight()!=64)throw new AssertionError(mesh);
                  int head=count(m,32,0,64,16);
                  int body=count(m,16,32,40,48);
                  if(head==0)throw new AssertionError("empty HEAD "+h);
                  if(h>=6&&h<=10&&body==0)throw new AssertionError("empty BODY "+h);
                  if((h<6||h>10)&&body!=0)throw new AssertionError("unexpected BODY "+h);

                  boolean sh=h<=5; int local=sh?h:h-5;
                  String pre=String.format(
                    "assets/nexuscharacters/appearance_parts_v064/hair/"+
                    (sh?"hair_short_%02d_pre13.png":"hair_long_%02d_pre13.png"),local);
                  BufferedImage p=read(z,pre);
                  if(p==null)throw new AssertionError("missing "+pre);

                  if(count(p,32,0,64,16)!=0)
                    throw new AssertionError("flat outer head survives "+h);
                  if(h>=6&&h<=10&&count(p,16,32,40,48)!=0)
                    throw new AssertionError("flat outer torso survives "+h);

                  System.out.printf("hair_%02d HEAD=%d BODY=%d stripped=OK%n",h,head,body);
                }
              }
            }
          }
          JAVA
          javac /tmp/ForensicHair.java
          java -cp /tmp ForensicHair "$J"

      - name: Static risk checks
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE14.jar"
          # PRE14 must not modify unrelated subsystems compared with PRE13 validation record:
          unzip -p "$J" fabric.mod.json | grep -F '"version": "1.0.0-beta.14+hc.1.21.11"'
          test -f mods/nexuscharacters/reference/BETA-1.0-PRE14/VALIDATION.md
          test -f mods/nexuscharacters/reference/BETA-1.0-PRE14/SHA256SUMS.txt
