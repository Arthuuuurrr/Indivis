name: Normalize JARs to LFS

on:
  push:
    branches:
      - artifacts/history-wave-1
    paths:
      - '.github/normalize-lfs.trigger'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: artifacts/history-wave-1
          fetch-depth: 0
          lfs: false

      - name: Normalize JARs to Git LFS
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --renormalize artifacts/jars
          rm -f .github/normalize-lfs.trigger
          git add -A .github/normalize-lfs.trigger
          if git diff --cached --quiet; then
            echo "Nothing to normalize."
            exit 0
          fi
          git commit -m "artifacts: normalize JAR history to Git LFS"
          git push origin HEAD:artifacts/history-wave-1
