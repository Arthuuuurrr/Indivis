name: Nexus PRE10 render inspect

on:
  push:
    paths:
      - ".github/workflows/nexus-pre10-render-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Inspect long-hair UV occupancy
        shell: bash
        run: |
          python -m pip install --quiet pillow
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE9.jar"
          python - <<'PY'
          import io, zipfile
          from PIL import Image

          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE9.jar"
          # Rectangles intentionally broad enough to identify which vanilla body
          # UV families carry hair pixels. x0,y0,x1,y1 (exclusive).
          regions={
              "head_base":(0,0,32,16),
              "head_outer":(32,0,64,16),
              "torso_base":(16,16,40,32),
              "right_arm_base":(40,16,56,32),
              "torso_outer":(16,32,40,48),
              "right_arm_outer":(40,32,56,48),
              "left_arm_base":(32,48,48,64),
              "left_arm_outer":(48,48,64,64),
              "legs_all":(0,16,32,64),
          }

          with zipfile.ZipFile(J) as z:
              names=sorted(n for n in z.namelist() if n.startswith("assets/nexuscharacters/appearance_parts_v064/hair/hair_long_") and n.endswith(".png"))
              for name in names:
                  im=Image.open(io.BytesIO(z.read(name))).convert("RGBA")
                  a=im.getchannel("A")
                  px=a.load()
                  print("\n",name)
                  for key,(x0,y0,x1,y1) in regions.items():
                      coords=[(x,y) for y in range(y0,y1) for x in range(x0,x1) if px[x,y] != 0]
                      if coords:
                          xs=[p[0] for p in coords]; ys=[p[1] for p in coords]
                          print(f"  {key}: count={len(coords)} bbox=({min(xs)},{min(ys)})-({max(xs)},{max(ys)})")
          PY
