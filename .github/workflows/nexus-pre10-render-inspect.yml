name: Nexus PRE10 render inspect

on:
  push:
    paths:
      - ".github/workflows/nexus-pre10-render-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Decompile exact skin compositor
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE9.jar"
          curl -fsSL https://www.benf.org/other/cfr/cfr-0.152.jar -o /tmp/cfr.jar
          mkdir -p /tmp/decomp
          java -jar /tmp/cfr.jar "$J" --outputdir /tmp/decomp --silent true >/dev/null 2>&1

          for f in             /tmp/decomp/net/tompsen/nexuscharacters/DynamicAppearanceSupport.java             /tmp/decomp/net/tompsen/nexuscharacters/ModularSkinSupport.java             /tmp/decomp/net/tompsen/nexuscharacters/Appearance69Support.java             /tmp/decomp/net/tompsen/nexuscharacters/Appearance68Support.java             /tmp/decomp/net/tompsen/nexuscharacters/Appearance65Support.java; do
            echo "===== $f ====="
            cat "$f"
          done

          echo "=== LONG HAIR ASSET SHA/SIZES ==="
          unzip -Z1 "$J" | grep '^assets/nexuscharacters/appearance_parts_v064/hair/hair_long_.*\.png$' | while read p; do
            unzip -p "$J" "$p" >/tmp/x.png
            printf '%s ' "$p"
            sha256sum /tmp/x.png | awk '{print $1}'
          done
