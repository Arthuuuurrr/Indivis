name: Package capitale-core

on:
  push:
    branches:
      - feature/indivis-corruption-biome
    paths:
      - '.github/workflows/package-capitale-core.yml'
      - 'datapacks/capitale-core/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Build complete datapack ZIP
        run: |
          cd datapacks/capitale-core
          zip -r ../../capitale-core-INDIVIS-BIOMES-FULL.zip .

      - name: Upload complete core
        uses: actions/upload-artifact@v4
        with:
          name: capitale-core-INDIVIS-BIOMES-FULL
          path: capitale-core-INDIVIS-BIOMES-FULL.zip
          if-no-files-found: error
          retention-days: 7
