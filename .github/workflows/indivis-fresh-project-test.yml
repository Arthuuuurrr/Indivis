name: Indivis Fresh Project Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/indivis-fresh-project-test.yml"

permissions:
  contents: read
  issues: read

jobs:
  fresh-project-test:
    runs-on: ubuntu-latest
    env:
      PROJECT_TOKEN: ${{ secrets.INDIVIS_PROJECT_TOKEN }}

    steps:
      - name: Create fresh Project and test one issue
        shell: bash
        run: |
          set -euo pipefail

          OWNER="Arthuuuurrr"
          REPO="Indivis"
          TITLE="Indivis Repair Test"
          ISSUE_NUMBER=83

          gql() {
            GH_TOKEN="${PROJECT_TOKEN}" gh api graphql "$@"
          }

          api() {
            GH_TOKEN="${PROJECT_TOKEN}" gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" "$@"
          }

          identity="$(gql -f query='
            query($login:String!,$repo:String!){
              user(login:$login){id}
              repository(owner:$login,name:$repo){id}
            }' -f login="$OWNER" -f repo="$REPO")"

          owner_id="$(jq -r '.data.user.id' <<<"$identity")"
          repo_id="$(jq -r '.data.repository.id' <<<"$identity")"

          existing="$(gql -f query='
            query($login:String!){
              user(login:$login){
                projectsV2(first:100){nodes{id number title}}
              }
            }' -f login="$OWNER")"

          project_id="$(jq -r --arg title "$TITLE" '
            .data.user.projectsV2.nodes[]
            | select(.title == $title)
            | .id
          ' <<<"$existing" | head -n1)"

          project_number="$(jq -r --arg title "$TITLE" '
            .data.user.projectsV2.nodes[]
            | select(.title == $title)
            | .number
          ' <<<"$existing" | head -n1)"

          if [[ -z "$project_id" || "$project_id" == "null" ]]; then
            echo "Creating fresh test Project"
            created="$(gql -f query='
              mutation($owner:ID!,$repo:ID!,$title:String!){
                createProjectV2(input:{ownerId:$owner,repositoryId:$repo,title:$title}){
                  projectV2{id number title url}
                }
              }' -f owner="$owner_id" -f repo="$repo_id" -f title="$TITLE")"
            project_id="$(jq -r '.data.createProjectV2.projectV2.id' <<<"$created")"
            project_number="$(jq -r '.data.createProjectV2.projectV2.number' <<<"$created")"
            echo "$created" | jq '.data.createProjectV2.projectV2'
          else
            echo "Reusing fresh test Project #$project_number"
          fi

          issue="$(api "repos/$OWNER/$REPO/issues/$ISSUE_NUMBER")"
          issue_node="$(jq -r '.node_id' <<<"$issue")"

          added="$(gql -f query='
            mutation($project:ID!,$content:ID!){
              addProjectV2ItemById(input:{projectId:$project,contentId:$content}){
                item{id}
              }
            }' -f project="$project_id" -f content="$issue_node")"

          item_id="$(jq -r '.data.addProjectV2ItemById.item.id' <<<"$added")"
          echo "Added item node: $item_id"

          sleep 5

          forward="$(gql -f query='
            query($login:String!,$number:Int!){
              user(login:$login){
                projectV2(number:$number){
                  id
                  title
                  items(first:20){
                    totalCount
                    nodes{
                      id
                      content{
                        ... on Issue{number title}
                      }
                    }
                  }
                }
              }
            }' -f login="$OWNER" -F number="$project_number")"

          count="$(jq -r '.data.user.projectV2.items.totalCount' <<<"$forward")"
          visible="$(jq -r --argjson n "$ISSUE_NUMBER" '
            [.data.user.projectV2.items.nodes[]
             | select(.content.number == $n)]
            | length
          ' <<<"$forward")"

          echo "Fresh Project number: $project_number"
          echo "Fresh Project forward count: $count"
          echo "Issue #$ISSUE_NUMBER visible: $visible"

          if [[ "$visible" == "1" ]]; then
            echo "FRESH_PROJECT_TEST=PASS"
            exit 0
          fi

          echo "FRESH_PROJECT_TEST=FAIL"

          echo "Deleting failed temporary Project"
          gql -f query='
            mutation($project:ID!){
              deleteProjectV2(input:{projectId:$project}){projectV2{id}}
            }' -f project="$project_id" >/dev/null

          exit 1
