name: Rebuild JAR library

on:
  push:
    branches:
      - artifacts/jar-library
    paths:
      - 'artifact-staging/.ready'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: artifacts/jar-library
          fetch-depth: 0

      - name: Rebuild JARs from temporary chunks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, shutil

          root = Path("artifact-staging")
          out_root = Path("artifacts/jars")
          manifest_path = root / "manifest.tsv"
          if not manifest_path.exists():
              raise SystemExit("Missing artifact-staging/manifest.tsv")

          rebuilt = []
          for line in manifest_path.read_text(encoding="utf-8").splitlines():
              if not line.strip() or line.startswith("#"):
                  continue
              directory, module, target, expected = line.split("\t")
              d = root / directory
              parts = sorted(d.glob("part_*.b64"))
              if not parts:
                  raise SystemExit(f"No chunks for {directory}")
              data = b"".join(base64.b64decode(p.read_text(encoding="utf-8")) for p in parts)
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected.lower():
                  raise SystemExit(f"SHA mismatch for {target}: {actual} != {expected}")
              dest = out_root / module / target
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              rebuilt.append((module, target, len(data), actual))
              shutil.rmtree(d)

          for p in (root / ".ready", manifest_path):
              if p.exists():
                  p.unlink()
          if root.exists() and not any(root.iterdir()):
              root.rmdir()

          print("Rebuilt:")
          for row in rebuilt:
              print(*row)
          PY

      - name: Commit reconstructed binaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A artifacts/jars artifact-staging || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "artifacts: reconstruct JAR library"
          git push origin HEAD:artifacts/jar-library
