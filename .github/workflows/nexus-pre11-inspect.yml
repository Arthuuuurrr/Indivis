name: Nexus PRE11 inspect

on:
  push:
    paths:
      - ".github/workflows/nexus-pre11-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Decompile relevant classes
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE10.jar"
          curl -fsSL https://www.benf.org/other/cfr/cfr-0.152.jar -o /tmp/cfr.jar
          mkdir -p /tmp/decomp
          java -jar /tmp/cfr.jar "$J" --outputdir /tmp/decomp --silent true >/dev/null 2>&1
          for f in             /tmp/decomp/net/tompsen/nexuscharacters/BeardVoxelModelFactory.java             /tmp/decomp/net/tompsen/nexuscharacters/LongHair3DRenderSupport.java             /tmp/decomp/net/tompsen/nexuscharacters/CharacterCosmeticFeatureRenderer.java             /tmp/decomp/net/tompsen/nexuscharacters/CharacterPreviewRenderer.java             /tmp/decomp/net/tompsen/nexuscharacters/WorldlessCosmeticPreview.java; do
            echo "===== $f ====="
            [ -f "$f" ] && cat "$f"
          done
