                      require(model.field_3479.injectedMesh!=null,"right pants mesh missing");
                  }
                  require(dev.tr7zw.skinlayers.SkinUtil.resolves==1,"dynamic texture not resolved through SkinUtil");
                  require(dev.tr7zw.skinlayers.api.SkinLayersAPI.created==8,"expected 8 cached main outer meshes");

                  int beforeWidgets=class_8765.created;
                  net.tompsen.nexuscharacters.PreviewDragInput.yaw=0f;
                  net.tompsen.nexuscharacters.BeardPreviewVisibilitySupport.render(
                      new Object(),h08,main,589,170,118,157,600,250,0f);
                  require(class_8765.created==beforeWidgets+1,"hair overlay widget not created");
                  require(class_8765.renders==1,"hair overlay widget not rendered");
                  require(net.tompsen.nexuscharacters.WorldlessBeardWidgetRenderer.renders==1,"front beard path changed");

                  class_8765 overlay=class_8765.lastCreated;
                  class_630 head=child(overlay.field_59834.field_3398,"nexuscharacters$hair_head");
                  class_630 body=child(overlay.field_59834.field_3391,"nexuscharacters$hair_body");
                  require(head!=null&&head.injectedMesh!=null,"h08 HEAD dedicated mesh absent");
                  require(body!=null&&body.injectedMesh!=null,"h08 BODY dedicated mesh absent");
                  require(overlay.field_59834.field_3398.field_38456,"overlay base head cubes not suppressed");
                  require(overlay.field_59834.field_3391.field_38456,"overlay base body cubes not suppressed");

                  class_4587 matrices=new class_4587();
                  body.injectedOffset.applyOffset(matrices,body.injectedMesh);
                  require(!matrices.scales.isEmpty(),"hair BODY extra scale not applied");
                  float[] s=matrices.scales.get(matrices.scales.size()-1);
