      - name: Verify PRE16 structure and regression scope
        shell: bash
        run: |
          BASE="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE15.jar"
          OUT="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE16.jar"

          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile

          base=Path("mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE15.jar")
          out=Path("mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE16.jar")

          with zipfile.ZipFile(base) as z0, zipfile.ZipFile(out) as z1:
              n0=set(z0.namelist()); n1=set(z1.namelist())
              added=n1-n0
              expected_added={
                  "net/tompsen/nexuscharacters/WorldlessSkinLayersPreviewSupport.class",
                  "net/tompsen/nexuscharacters/WorldlessHairWidgetRenderer.class",
              }
              if added != expected_added:
                  raise SystemExit(f"unexpected PRE16 added entries: {sorted(added)}")
              if n0-n1:
                  raise SystemExit(f"PRE16 removed entries: {sorted(n0-n1)}")

              changed={
                  n for n in n0
                  if hashlib.sha256(z0.read(n)).digest()!=hashlib.sha256(z1.read(n)).digest()
              }
              expected_changed={
                  "net/tompsen/nexuscharacters/LongHair3DRenderSupport.class",
                  "net/tompsen/nexuscharacters/BeardPreviewVisibilitySupport.class",
                  "net/tompsen/nexuscharacters/WorldlessCosmeticPreview.class",
                  "fabric.mod.json",
              }
              if changed != expected_changed:
                  raise SystemExit(f"unexpected PRE16 changed entries: {sorted(changed)}")

              # All PRE14/PRE15 hair assets and colour topology remain byte-identical.
              for name in n0:
                  if name.startswith("assets/nexuscharacters/appearance_parts_v064/hair/")                      or name.startswith("assets/nexuscharacters/textures/cosmetic/hair_3d"):
                      if hashlib.sha256(z0.read(name)).digest()!=hashlib.sha256(z1.read(name)).digest():
                          raise SystemExit(f"hair asset changed unexpectedly: {name}")

              for name in (
                  "net/tompsen/nexuscharacters/CharacterPreviewRenderer.class",
                  "net/tompsen/nexuscharacters/CharacterCosmeticFeatureRenderer.class",
                  "net/tompsen/nexuscharacters/DynamicAppearanceSupport.class",
                  "net/tompsen/nexuscharacters/WorldlessBeardWidgetRenderer.class",
                  "net/tompsen/nexuscharacters/WorldlessEarWidgetRenderer.class",
                  "net/tompsen/nexuscharacters/FixedBeardPreviewRenderer.class",
                  "net/tompsen/nexuscharacters/UnifiedPilositySupport.class",
                  "net/tompsen/nexuscharacters/ProfileStateBridge.class",
                  "net/tompsen/nexuscharacters/PuffishSkillsBridge.class",
                  "net/tompsen/nexuscharacters/NexusCharacters.class",
                  "net/tompsen/nexuscharacters/LongBeardModelSupport.class",
              ):
                  if hashlib.sha256(z0.read(name)).digest()!=hashlib.sha256(z1.read(name)).digest():
                      raise SystemExit(f"preserved class changed: {name}")

              mod=json.loads(z1.read("fabric.mod.json"))
              if mod.get("version")!="1.0.0-beta.16+hc.1.21.11":
                  raise SystemExit("wrong PRE16 version")

          raw=out.read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          size=len(raw)
          ref=Path("mods/nexuscharacters/reference/BETA-1.0-PRE16")
          (ref/"SHA256SUMS.txt").write_text(f"{sha}  {out.name}\n",encoding="utf-8")
          (ref/"VALIDATION.md").write_text(
              "# Validation BETA 1.0 PRE16\n\n"
              f"- JAR : `{out.name}`\n"
              f"- Taille : **{size} octets**\n"
              f"- SHA-256 : `{sha}`\n"
              "- Base PRE15 SHA vérifiée.\n"
              "- Cause PRE15 confirmée : l'aperçu worldless PlayerSkinWidget ne passe pas par CharacterCosmeticFeatureRenderer.\n"
              "- Main PlayerSkinWidget : 6 couches outer injectées avec les meshes/OffsetProvider officiels de Skin Layers, wide + slim.\n"
              "- Hair overlay : widget séparé, HEAD+BODY dédiés, y compris en rotation arrière.\n"
              "- Harness h08 : BODY présent et offset extra 1.16 / 1.02 / 1.45 appliqué.\n"
              "- Les 247 textures 3D teintées et tous les assets hair PRE15 sont byte-identiques.\n"
              "- Barbe/oreilles, CharacterPreviewRenderer, DynamicAppearanceSupport, sauvegarde et ABI restent inchangés.\n"
              "- Version : `1.0.0-beta.16+hc.1.21.11`.\n",
              encoding="utf-8"
          )
          print("PRE16",size,sha)
          PY

          # Confirm diagnostic strings and no hidden companion classes.
          jar tf "$OUT" | grep -F 'net/tompsen/nexuscharacters/WorldlessSkinLayersPreviewSupport.class'
          jar tf "$OUT" | grep -F 'net/tompsen/nexuscharacters/WorldlessHairWidgetRenderer.class'
          test "$(jar tf "$OUT" | grep -c 'WorldlessHairWidgetRenderer.*\.class$')" -eq 1
          unzip -p "$OUT" net/tompsen/nexuscharacters/WorldlessHairWidgetRenderer.class             | strings | grep -F '[NexusCharacters][HairPreview3D] READY'
          unzip -p "$OUT" net/tompsen/nexuscharacters/WorldlessSkinLayersPreviewSupport.class             | strings | grep -F '[NexusCharacters][SkinLayersPreview] READY'

      - name: Publish PRE16 through Git LFS
        shell: bash
        run: |
          git lfs install --local
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f --ignore-unmatch             mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE15.jar             .github/workflows/nexus-pre15-preview-audit.yml             .github/workflows/nexus-pre15-worldless-audit.yml             .github/workflows/nexus-pre16-skinlayers-fields.yml             .github/workflows/nexus-pre16-dynamic-texture.yml

          git add             mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE16.jar             mods/nexuscharacters/reference/BETA-1.0-PRE16

          if git diff --cached --quiet; then
            echo "No PRE16 artifacts to publish."
            exit 0
          fi

          git commit -m "nexus: publish BETA 1.0 PRE16 worldless Skin Layers preview"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
