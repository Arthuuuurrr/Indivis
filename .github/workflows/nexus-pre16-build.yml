name: Build Nexus BETA 1.0 PRE16

on:
  push:
    paths:
      - "mods/nexuscharacters/reference/BETA-1.0-PRE16/**"
      - ".github/workflows/nexus-pre16-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify PRE15 base
        shell: bash
        run: |
          BASE="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE15.jar"
          test -s "$BASE"
          unzip -t "$BASE" >/dev/null
          ACTUAL="$(sha256sum "$BASE" | awk '{print $1}')"
          EXPECTED="ae3c6b30ac7a2c75d1e92a44c2b76a1053c59ed2676d1c2dd3b658d3566f75af"
          test "$ACTUAL" = "$EXPECTED" || {
            echo "PRE15 SHA mismatch: $ACTUAL"
            exit 1
          }

      - name: Compile PRE16 preview fix
        shell: bash
        run: |
          BASE="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE15.jar"
          mkdir -p /tmp/pre16-classes

          javac -cp "$BASE" -d /tmp/pre16-classes             mods/nexuscharacters/reference/BETA-1.0-PRE16/sources/LongHair3DRenderSupport.java             mods/nexuscharacters/reference/BETA-1.0-PRE16/sources/WorldlessSkinLayersPreviewSupport.java             mods/nexuscharacters/reference/BETA-1.0-PRE16/sources/WorldlessHairWidgetRenderer.java             mods/nexuscharacters/reference/BETA-1.0-PRE16/sources/BeardPreviewVisibilitySupport.java             mods/nexuscharacters/reference/BETA-1.0-PRE16/sources/WorldlessCosmeticPreview.java

          for c in             LongHair3DRenderSupport             WorldlessSkinLayersPreviewSupport             WorldlessHairWidgetRenderer             BeardPreviewVisibilitySupport             WorldlessCosmeticPreview; do
            test -f "/tmp/pre16-classes/net/tompsen/nexuscharacters/$c.class"
          done

          # No new companion class may be silently omitted like PRE14 HairParts.
          find /tmp/pre16-classes/net/tompsen/nexuscharacters -type f -name '*.class' -print | sort
          test "$(find /tmp/pre16-classes/net/tompsen/nexuscharacters -type f -name '*.class' | wc -l)" -eq 5

      - name: Assemble PRE16
        shell: bash
        run: |
          BASE="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE15.jar"
          OUT="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE16.jar"
          cp "$BASE" "$OUT"

          jar uf "$OUT"             -C /tmp/pre16-classes net/tompsen/nexuscharacters/LongHair3DRenderSupport.class             -C /tmp/pre16-classes net/tompsen/nexuscharacters/WorldlessSkinLayersPreviewSupport.class             -C /tmp/pre16-classes net/tompsen/nexuscharacters/WorldlessHairWidgetRenderer.class             -C /tmp/pre16-classes net/tompsen/nexuscharacters/BeardPreviewVisibilitySupport.class             -C /tmp/pre16-classes net/tompsen/nexuscharacters/WorldlessCosmeticPreview.class

          mkdir -p /tmp/pre16-meta
          unzip -p "$OUT" fabric.mod.json > /tmp/pre16-meta/fabric.mod.json
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("/tmp/pre16-meta/fabric.mod.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          data["version"]="1.0.0-beta.16+hc.1.21.11"
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          jar uf "$OUT" -C /tmp/pre16-meta fabric.mod.json
          unzip -t "$OUT" >/dev/null

      - name: Verify exact 3D Skin Layers 1.10.2 contract
        shell: bash
        run: |
          curl -fL --retry 3             "https://github.com/tr7zw/3d-Skin-Layers/releases/download/1.10.2/skinlayers3d-fabric-1.10.2-mc1.21.11.jar"             -o /tmp/skinlayers.jar
          echo "736f076b9f45bab1c118166857f46729f782ddd481a0e4e4ee0bc110643f2756  /tmp/skinlayers.jar"             | sha256sum -c -

          javap -classpath /tmp/skinlayers.jar -p -s dev.tr7zw.skinlayers.SkinUtil             | grep -A2 -F 'getTexture(net.minecraft.class_2960, dev.tr7zw.skinlayers.accessor.SkullSettings)'
          javap -classpath /tmp/skinlayers.jar -p dev.tr7zw.skinlayers.api.MeshHelper             | grep -F 'create3DMesh'
          javap -classpath /tmp/skinlayers.jar -p dev.tr7zw.skinlayers.accessor.ModelPartInjector             | grep -F 'setInjectedMesh'

          # Exact intermediary outer-layer fields used by the official 1.10.2 mixin.
          javap -classpath /tmp/skinlayers.jar -p -c dev.tr7zw.skinlayers.mixin.PlayerModelMixin > /tmp/sl-player.txt
          for field in field_3394 field_3483 field_3484 field_3486 field_3482 field_3479; do
            grep -F "Field $field:Lnet/minecraft/class_630;" /tmp/sl-player.txt
          done

      - name: Build PRE16 worldless integration stubs
