                  net.tompsen.nexuscharacters.WorldlessCosmeticPreview.apply(main,h08);
                  require(net.tompsen.nexuscharacters.CosmeticColorSupport.dto==h08,"preview DTO bridge not preserved");

                  // All six vanilla outer parts must now carry genuine Skin Layers meshes.
                  for(class_591 model:new class_591[]{main.field_59834,main.field_59835}){
