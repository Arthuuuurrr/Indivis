name: Audit creature bundle entity removal

on:
  push:
    branches:
      - fix/121-marine-spawn-safety
    paths:
      - '.github/workflows/audit-creature-entity-removal.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Print concise removal paths
        shell: bash
        run: |
          set -euo pipefail
          bundle="mods/capitale_creatures_bundle-1.2.47-fabric-1.21.11-SPAWN-TIME-JOCKEY-MIXIN-HOTFIX-NO-ORC-CHANGES.jar"
          python3 - "$bundle" <<'PY'
          import io, re, subprocess, sys, zipfile
          jar=sys.argv[1]
          z=zipfile.ZipFile(jar)
          print("=== DIRECT EASY_NPC REFERENCES ===")
          for n in z.namelist():
              if n.endswith(".jar"): continue
              try: b=z.read(n)
              except: continue
              if b"easy_npc" in b:
                  print(n)
          print("=== OUTER CLASS CANDIDATES ===")
          candidates=[]
          markers=[b"method_31472",b"method_27909",b"method_18456"]
          for n in z.namelist():
              if not n.startswith("fr/hautecapitale/creatures/") or not n.endswith(".class"): continue
              b=z.read(n)
              hits=[m.decode() for m in markers if m in b]
              if hits:
                  cls=n[:-6].replace("/",".")
                  candidates.append(cls)
                  print(cls,"::",",".join(hits))
          print("=== JAVAP CONTEXT ===")
          for cls in candidates:
              print("\n###",cls)
              p=subprocess.run(["javap","-classpath",jar,"-p","-c",cls],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              lines=p.stdout.splitlines()
              hitidx=[i for i,l in enumerate(lines) if any(x in l for x in ("method_31472","method_27909","method_18456"))]
              if not hitidx:
                  print("\n".join(lines[:180])); continue
              ranges=[]
              for i in hitidx:
                  ranges.append((max(0,i-55),min(len(lines),i+80)))
              merged=[]
              for lo,hi in ranges:
                  if merged and lo<=merged[-1][1]: merged[-1]=(merged[-1][0],max(merged[-1][1],hi))
                  else: merged.append((lo,hi))
              for lo,hi in merged:
                  print("\n".join(lines[lo:hi]))
                  print("...")
          print("=== DATAPACK DELETE COMMANDS ===")
          import pathlib
          root=pathlib.Path("datapacks/capitale-creatures-biomes")
          rx=re.compile(r"(^|\s)(kill\s|data\s+remove|run\s+kill\s)",re.I)
          for p in root.rglob("*"):
              if p.is_file():
                  try:
                      for i,l in enumerate(p.read_text(errors="ignore").splitlines(),1):
                          if rx.search(l): print(f"{p}:{i}:{l}")
                  except: pass
          PY
