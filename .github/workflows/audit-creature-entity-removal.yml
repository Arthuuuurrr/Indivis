name: Audit creature bundle entity removal

on:
  push:
    branches:
      - fix/121-marine-spawn-safety
    paths:
      - '.github/workflows/audit-creature-entity-removal.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect Runtime124 despawn policy
        shell: bash
        run: |
          set -euo pipefail
          bundle="mods/capitale_creatures_bundle-1.2.47-fabric-1.21.11-SPAWN-TIME-JOCKEY-MIXIN-HOTFIX-NO-ORC-CHANGES.jar"
          echo "=== POLICY MARKER ==="
          unzip -p "$bundle" META-INF/INDIVIS_GLOBAL_LIVING_DESPAWN_1_2_20.txt || true
          echo
          echo "=== RUNTIME124 STRINGS RELATED TO PROTECTION ==="
          unzip -p "$bundle" fr/hautecapitale/creatures/spawn/CapitaleCreaturesRuntime124.class | strings | grep -Ei 'easy_npc|persistent|despawn|named|custom|owner|quest|npc|living|hostile|distance' || true
          echo
          echo "=== SHOULD HARD DESPAWN METHOD ==="
          javap -classpath "$bundle" -p -c fr.hautecapitale.creatures.spawn.CapitaleCreaturesRuntime124 > /tmp/runtime124.txt
          python3 - <<'PY'
          import re
          lines=open("/tmp/runtime124.txt").read().splitlines()
          targets=["shouldHardDespawnLiving","hardDespawn"]
          for target in targets:
              print("\n###",target)
              starts=[i for i,l in enumerate(lines) if target in l and re.search(r'\b(private|public|protected)\b',l)]
              for st in starts:
                  en=len(lines)
                  for j in range(st+1,len(lines)):
                      if re.match(r'^  (private|public|protected) ',lines[j]):
                          en=j; break
                  print("\n".join(lines[st:en]))
          PY
