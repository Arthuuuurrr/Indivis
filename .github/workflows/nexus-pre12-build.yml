name: Build Nexus BETA 1.0 PRE12

on:
  push:
    paths:
      - "mods/nexuscharacters/reference/BETA-1.0-PRE12/**"
      - ".github/workflows/nexus-pre12-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify PRE11 base
        shell: bash
        run: |
          BASE="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE11.jar"
          test -s "$BASE"
          unzip -t "$BASE" >/dev/null
          ACTUAL="$(sha256sum "$BASE" | awk '{print $1}')"
          EXPECTED="d5ec1647d17a3953225fe8507c69b72f26c31f2d73367a5a859d8e677f10de46"
          test "$ACTUAL" = "$EXPECTED" || {
            echo "PRE11 SHA mismatch: $ACTUAL"
            exit 1
          }

      - name: Fetch compile-only Mixin API
        shell: bash
        run: |
          URL='https://maven.fabricmc.net/net/fabricmc/sponge-mixin/0.17.4+mixin.0.8.7/sponge-mixin-0.17.4+mixin.0.8.7.jar'
          curl -fsSL "$URL" -o /tmp/sponge-mixin.jar
          echo '1f0ae44db7295f8626f33b1dc0ad7f043d8954a8d6847247875fcc5dfcecc934  /tmp/sponge-mixin.jar' | sha256sum -c -
          jar tf /tmp/sponge-mixin.jar | grep -q '^org/spongepowered/asm/mixin/Mixin.class$'
          jar tf /tmp/sponge-mixin.jar | grep -q '^org/spongepowered/asm/mixin/Pseudo.class$'
          jar tf /tmp/sponge-mixin.jar | grep -q '^org/spongepowered/asm/mixin/injection/Inject.class$'
          jar tf /tmp/sponge-mixin.jar | grep -q '^org/spongepowered/asm/mixin/injection/Coerce.class$'

      - name: Compile PRE12 sources
        shell: bash
        run: |
          BASE="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE11.jar"
          mkdir -p /tmp/pre12-classes /tmp/pre12-tools

          javac -cp "$BASE" -d /tmp/pre12-classes             mods/nexuscharacters/reference/BETA-1.0-PRE12/sources/SkinLayersDynamicSkinBridge.java             mods/nexuscharacters/reference/BETA-1.0-PRE12/sources/LongHair3DRenderSupport.java

          javac -proc:none -cp "$BASE:/tmp/pre12-classes:/tmp/sponge-mixin.jar" -d /tmp/pre12-classes             mods/nexuscharacters/reference/BETA-1.0-PRE12/sources/SkinLayersPlayerUtilCompatMixin.java

          javac -d /tmp/pre12-tools             mods/nexuscharacters/reference/BETA-1.0-PRE12/tools/SeparateLongHairFromBody.java

          test -f /tmp/pre12-classes/net/tompsen/nexuscharacters/SkinLayersDynamicSkinBridge.class
          test -f /tmp/pre12-classes/net/tompsen/nexuscharacters/LongHair3DRenderSupport.class
          test -f /tmp/pre12-classes/net/tompsen/nexuscharacters/mixin/client/SkinLayersPlayerUtilCompatMixin.class

      - name: Prepare corrected long-hair assets
        shell: bash
        run: |
          BASE="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE11.jar"
          HAIR="/tmp/pre12-assets/assets/nexuscharacters/appearance_parts_v064/hair"
          BEFORE="/tmp/pre12-before"
          mkdir -p "$HAIR" "$BEFORE"

          for i in 01 02 03 04 05; do
            NAME="hair_long_${i}.png"
            unzip -p "$BASE" "assets/nexuscharacters/appearance_parts_v064/hair/$NAME" > "$HAIR/$NAME"
            cp "$HAIR/$NAME" "$BEFORE/$NAME"
          done

          java -cp /tmp/pre12-tools SeparateLongHairFromBody "$HAIR"

      - name: Assemble PRE12
        shell: bash
        run: |
          BASE="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE11.jar"
          OUT="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE12.jar"
          cp "$BASE" "$OUT"

          jar uf "$OUT"             -C /tmp/pre12-classes net/tompsen/nexuscharacters/SkinLayersDynamicSkinBridge.class             -C /tmp/pre12-classes net/tompsen/nexuscharacters/LongHair3DRenderSupport.class             -C /tmp/pre12-classes net/tompsen/nexuscharacters/mixin/client/SkinLayersPlayerUtilCompatMixin.class             -C /tmp/pre12-assets assets/nexuscharacters/appearance_parts_v064/hair

          mkdir -p /tmp/pre12-json
          unzip -p "$OUT" nexuscharacters.client.mixins.json > /tmp/pre12-json/nexuscharacters.client.mixins.json
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("/tmp/pre12-json/nexuscharacters.client.mixins.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          client=data.setdefault("client", [])
          name="SkinLayersPlayerUtilCompatMixin"
          if name not in client:
              client.append(name)
          if client.count(name) != 1:
              raise SystemExit("compat mixin duplicate")
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          jar uf "$OUT" -C /tmp/pre12-json nexuscharacters.client.mixins.json

          mkdir -p /tmp/pre12-meta
          unzip -p "$OUT" fabric.mod.json > /tmp/pre12-meta/fabric.mod.json
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("/tmp/pre12-meta/fabric.mod.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          data["version"]="1.0.0-beta.12+hc.1.21.11"
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          jar uf "$OUT" -C /tmp/pre12-meta fabric.mod.json

      - name: Validate hair separation
        shell: bash
        run: |
          OUT="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE12.jar"
          mkdir -p /tmp/pre12-after
          for i in 01 02 03 04 05; do
            unzip -p "$OUT" "assets/nexuscharacters/appearance_parts_v064/hair/hair_long_${i}.png"               > "/tmp/pre12-after/hair_long_${i}.png"
          done

          cat >/tmp/VerifyPre12Hair.java <<'JAVA'
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;

          public final class VerifyPre12Hair {
              public static void main(String[] args) throws Exception {
                  for (int i=1;i<=5;i++) {
                      BufferedImage before=ImageIO.read(new File(String.format("/tmp/pre12-before/hair_long_%02d.png",i)));
                      BufferedImage after=ImageIO.read(new File(String.format("/tmp/pre12-after/hair_long_%02d.png",i)));
                      if(before==null||after==null||before.getWidth()!=64||before.getHeight()!=64
                              ||after.getWidth()!=64||after.getHeight()!=64) {
                          throw new AssertionError("bad PNG "+i);
                      }

                      int baseBefore=0,baseAfter=0,outerBefore=0,outerAfter=0;
                      for(int y=0;y<64;y++) for(int x=0;x<64;x++) {
                          int b=before.getRGB(x,y);
                          int a=after.getRGB(x,y);
                          boolean base=x>=16&&x<40&&y>=16&&y<32;
                          boolean outer=x>=16&&x<40&&y>=32&&y<48;
                          if(base&&((b>>>24)&255)!=0) baseBefore++;
                          if(base&&((a>>>24)&255)!=0) baseAfter++;
                          if(outer&&((b>>>24)&255)!=0) outerBefore++;
                          if(outer&&((a>>>24)&255)!=0) outerAfter++;
                          if(!base && b!=a) throw new AssertionError("outside-base pixel changed "+i+" @ "+x+","+y);
                      }

                      if(baseAfter!=0) throw new AssertionError("base hair remains "+i+": "+baseAfter);
                      if(outerBefore<=0||outerAfter!=outerBefore) {
                          throw new AssertionError("outer hair changed "+i+": "+outerBefore+" -> "+outerAfter);
                      }
                      System.out.println("hair "+i+": base "+baseBefore+" -> 0; outer "+outerAfter+" kept");
                  }
              }
          }
          JAVA
          javac /tmp/VerifyPre12Hair.java
          java -cp /tmp VerifyPre12Hair

      - name: Validate structure and regressions
        shell: bash
        run: |
          BASE="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE11.jar"
          OUT="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE12.jar"
          unzip -t "$OUT" >/dev/null

          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile

          base=Path("mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE11.jar")
          out=Path("mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE12.jar")
          hair={f"assets/nexuscharacters/appearance_parts_v064/hair/hair_long_{i:02d}.png" for i in range(1,6)}
          added_expected={
              "net/tompsen/nexuscharacters/SkinLayersDynamicSkinBridge.class",
              "net/tompsen/nexuscharacters/mixin/client/SkinLayersPlayerUtilCompatMixin.class",
          }
          changed_required={
              "net/tompsen/nexuscharacters/LongHair3DRenderSupport.class",
              "nexuscharacters.client.mixins.json",
              "fabric.mod.json",
          }

          with zipfile.ZipFile(base) as z0, zipfile.ZipFile(out) as z1:
              n0=z0.namelist()
              n1=z1.namelist()
              if len(n1)!=len(set(n1)):
                  raise SystemExit("duplicate ZIP entries")
              added=set(n1)-set(n0)
              removed=set(n0)-set(n1)
              if removed:
                  raise SystemExit(f"removed entries: {sorted(removed)}")
              if added!=added_expected:
                  raise SystemExit(f"unexpected added entries: {sorted(added ^ added_expected)}")

              changed={
                  n for n in set(n0)&set(n1)
                  if hashlib.sha256(z0.read(n)).digest()!=hashlib.sha256(z1.read(n)).digest()
              }
              if not changed_required.issubset(changed):
                  raise SystemExit(f"missing changed entries: {sorted(changed_required-changed)}")
              unexpected=changed-changed_required-hair
              if unexpected:
                  raise SystemExit(f"unexpected changed entries: {sorted(unexpected)}")

              for name in (
                  "net/tompsen/nexuscharacters/UnifiedPilositySupport.class",
                  "net/tompsen/nexuscharacters/ProfileStateBridge.class",
                  "net/tompsen/nexuscharacters/PuffishSkillsBridge.class",
                  "net/tompsen/nexuscharacters/NexusCharacters.class",
                  "net/tompsen/nexuscharacters/LongBeardModelSupport.class",
                  "net/tompsen/nexuscharacters/CharacterCosmeticFeatureRenderer.class",
                  "net/tompsen/nexuscharacters/mixin/client/CharacterCreationAppearance65Mixin.class",
              ):
                  if hashlib.sha256(z0.read(name)).digest()!=hashlib.sha256(z1.read(name)).digest():
                      raise SystemExit(f"preserved class changed: {name}")

              for i in range(6,9):
                  name=f"assets/nexuscharacters/appearance_parts_v064/hair/hair_long_{i:02d}.png"
                  if hashlib.sha256(z0.read(name)).digest()!=hashlib.sha256(z1.read(name)).digest():
                      raise SystemExit(f"non-torso hair changed: {name}")

              mixins=json.loads(z1.read("nexuscharacters.client.mixins.json"))
              if mixins.get("client",[]).count("SkinLayersPlayerUtilCompatMixin")!=1:
                  raise SystemExit("compat mixin missing or duplicated")
              mod=json.loads(z1.read("fabric.mod.json"))
              if mod.get("version")!="1.0.0-beta.12+hc.1.21.11":
                  raise SystemExit("wrong PRE12 version")

          raw=out.read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          size=len(raw)
          ref=Path("mods/nexuscharacters/reference/BETA-1.0-PRE12")
          (ref/"SHA256SUMS.txt").write_text(f"{sha}  {out.name}\n",encoding="utf-8")
          (ref/"VALIDATION.md").write_text(
              "# Validation BETA 1.0 PRE12\n\n"
              f"- JAR : `{out.name}`\n"
              f"- Taille : **{size} octets**\n"
              f"- SHA-256 : `{sha}`\n"
              "- Base PRE11 SHA vérifiée.\n"
              "- Bridge de texture dynamique pour 3D Skin Layers ajouté via TRansition PlayerUtil.\n"
              "- Renderer long-hair expérimental PRE10/PRE11 neutralisé.\n"
              "- Cheveux longs 01..05 : couche torse de base nettoyée, surcouche conservée.\n"
              "- Cheveux longs 06..08 inchangés.\n"
              "- Sauvegarde PRE8, ABI PRE9, barbes, layout et renderer cosmétique appelant inchangés.\n"
              "- Version : `1.0.0-beta.12+hc.1.21.11`.\n",
              encoding="utf-8"
          )
          print("PRE12",size,sha)
          PY

      - name: Validate compatibility bytecode
        shell: bash
        run: |
          OUT="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE12.jar"

          javap -classpath "$OUT:/tmp/sponge-mixin.jar" -p -v             net.tompsen.nexuscharacters.mixin.client.SkinLayersPlayerUtilCompatMixin             | grep -E 'dev\.tr7zw\.transition\.mc\.PlayerUtil|getPlayerSkin|Pseudo'

          cat >/tmp/NexusPre12Probe.java <<'JAVA'
          public final class NexusPre12Probe {
              public static void main(String[] args) throws Exception {
                  Class<?> c=Class.forName("net.tompsen.nexuscharacters.LongHair3DRenderSupport");
                  var m=c.getMethod("hairAssetName",int.class);
                  check(m,6,"hair_long_01.png");
                  check(m,8,"hair_long_03.png");
                  check(m,10,"hair_long_05.png");
                  check(m,13,"hair_long_08.png");
              }
              private static void check(java.lang.reflect.Method m,int i,String e) throws Exception {
                  String a=(String)m.invoke(null,i);
                  if(!e.equals(a)) throw new AssertionError(i+": "+a);
              }
          }
          JAVA
          javac -cp "$OUT" /tmp/NexusPre12Probe.java
          java -cp "$OUT:/tmp" NexusPre12Probe

          javap -classpath "$OUT" -p net.tompsen.nexuscharacters.UnifiedPilositySupport             | grep -F 'public static boolean allowsPilosity(java.lang.Object);'

      - name: Publish PRE12 through Git LFS
        shell: bash
        run: |
          git lfs install --local
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f --ignore-unmatch mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE11.jar
          git add             mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE12.jar             mods/nexuscharacters/reference/BETA-1.0-PRE12/SHA256SUMS.txt             mods/nexuscharacters/reference/BETA-1.0-PRE12/VALIDATION.md

          if git diff --cached --quiet; then
            echo "No PRE12 artifacts to publish."
            exit 0
          fi

          git commit -m "nexus: publish BETA 1.0 PRE12 Skin Layers compatibility"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
