name: Refresh capitale_core 1.5.6-RC9AV archive

on:
  push:
    paths:
      - ".github/workflows/refresh-core-rc9av.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate archive
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path

          root = Path("datapacks/capitale-core")
          out = Path("datapacks/releases/capitale_core_1.5.6-RC9AV.zip")

          pack = json.loads((root / "pack.mcmeta").read_text(encoding="utf-8"))
          assert "1.5.6-RC9AV" in pack["pack"]["description"]

          corruption = root / "data/indivis/worldgen/biome/corruption.json"
          data = json.loads(corruption.read_text(encoding="utf-8"))
          assert data["effects"]["grass_color"] == "#778272"
          assert data["attributes"]["minecraft:visual/fog_color"] == "#817770"

          if out.exists():
              out.unlink()

          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(root.rglob("*")):
                  if p.is_file():
                      z.write(p, p.relative_to(root).as_posix())

          with zipfile.ZipFile(out) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Bad ZIP entry: {bad}")
              names = set(z.namelist())
              assert "pack.mcmeta" in names
              assert "data/indivis/worldgen/biome/corruption.json" in names
              archived = z.read("data/indivis/worldgen/biome/corruption.json")
              if hashlib.sha256(archived).hexdigest() != hashlib.sha256(corruption.read_bytes()).hexdigest():
                  raise SystemExit("Archived corruption.json differs from source")

          sha = hashlib.sha256(out.read_bytes()).hexdigest()
          size = out.stat().st_size
          Path("datapacks/releases/capitale_core_1.5.6-RC9AV.SHA256SUMS.txt").write_text(
              f"{sha}  {out.name}\n", encoding="utf-8"
          )
          Path("datapacks/releases/capitale_core_1.5.6-RC9AV.VALIDATION.md").write_text(
              "# capitale_core 1.5.6-RC9AV\n\n"
              f"- Archive complète : `{out.name}`\n"
              f"- Taille : **{size} octets**\n"
              f"- SHA-256 : `{sha}`\n"
              "- `pack.mcmeta` à la racine : OK\n"
              "- `data/indivis/worldgen/biome/corruption.json` : présent et identique à la source restaurée\n"
              "- JSON source : valide\n"
              "- Archive ZIP : valide\n"
              "- Base runtime : RC9AU + restauration de `indivis:corruption`\n"
              "- Documentation interne : historique de régression corrigé\n",
              encoding="utf-8"
          )
          print(sha, size)
          PY

      - name: Publish refreshed archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             datapacks/releases/capitale_core_1.5.6-RC9AV.zip             datapacks/releases/capitale_core_1.5.6-RC9AV.SHA256SUMS.txt             datapacks/releases/capitale_core_1.5.6-RC9AV.VALIDATION.md
          git commit -m "core: refresh RC9AV archive with corrected history"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
