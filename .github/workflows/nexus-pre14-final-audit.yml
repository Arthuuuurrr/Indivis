name: Nexus PRE14 overlap and bridge final audit

on:
  push:
    paths:
      - ".github/workflows/nexus-pre14-final-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Audit original and stripped long-hair UV occupancy
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE14.jar"
          rm -rf /tmp/hair && mkdir -p /tmp/hair
          for raw in $(seq 1 8); do
            n=$(printf "%02d" "$raw")
            unzip -p "$J" "assets/nexuscharacters/appearance_parts_v064/hair/hair_long_${n}.png" > "/tmp/hair/orig_${n}.png"
            unzip -p "$J" "assets/nexuscharacters/appearance_parts_v064/hair/hair_long_${n}_pre13.png" > "/tmp/hair/strip_${n}.png"
          done
          cat >/tmp/OverlapAudit.java <<'JAVA'
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;
          public final class OverlapAudit {
            static int c(BufferedImage i,int x0,int y0,int x1,int y1){
              int n=0;for(int y=y0;y<y1;y++)for(int x=x0;x<x1;x++)
                if(((i.getRGB(x,y)>>>24)&255)!=0)n++;return n;
            }
            public static void main(String[]a)throws Exception{
              for(int h=1;h<=8;h++){
                BufferedImage o=ImageIO.read(new File(String.format("/tmp/hair/orig_%02d.png",h)));
                BufferedImage s=ImageIO.read(new File(String.format("/tmp/hair/strip_%02d.png",h)));
                int baseHead=c(o,0,0,32,16), outerHead=c(o,32,0,64,16);
                int baseTorso=c(o,16,16,40,32), outerTorso=c(o,16,32,40,48);
                int sBaseTorso=c(s,16,16,40,32), sOuterTorso=c(s,16,32,40,48);
                System.out.printf("long_%02d baseHead=%d outerHead=%d baseTorso=%d outerTorso=%d strippedBaseTorso=%d strippedOuterTorso=%d%n",
                  h,baseHead,outerHead,baseTorso,outerTorso,sBaseTorso,sOuterTorso);
                if(h<=5 && sOuterTorso!=0)throw new AssertionError("outer torso not stripped "+h);
              }
            }
          }
          JAVA
          javac /tmp/OverlapAudit.java
          java -cp /tmp OverlapAudit

      - name: Verify PRE14 mixin annotations against exact TRansition descriptor
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE14.jar"
          curl -fL --retry 3 "https://github.com/tr7zw/3d-Skin-Layers/releases/download/1.10.2/skinlayers3d-fabric-1.10.2-mc1.21.11.jar" -o /tmp/skinlayers.jar
          test "$(sha256sum /tmp/skinlayers.jar | awk '{print $1}')" = "736f076b9f45bab1c118166857f46729f782ddd481a0e4e4ee0bc110643f2756"
          unzip -p /tmp/skinlayers.jar "META-INF/jars/TRansition-1.0.13-1.21.11-fabric-SNAPSHOT.jar" > /tmp/transition.jar

          echo "=== exact target overload ==="
          javap -classpath /tmp/transition.jar -p -s dev.tr7zw.transition.mc.PlayerUtil             | grep -A2 -B1 'getPlayerSkin(net.minecraft.class_11890)'

          echo "=== PRE14 mixin verbose annotations ==="
          javap -classpath "$J" -p -v net.tompsen.nexuscharacters.mixin.client.SkinLayersPlayerUtilCompatMixin             | grep -A80 -B10 -E 'RuntimeVisibleAnnotations|RuntimeInvisibleAnnotations|getPlayerSkin|dev.tr7zw.transition.mc.PlayerUtil|require|cancellable|remap'

          echo "=== mixin JSON ==="
          unzip -p "$J" nexuscharacters.client.mixins.json

      - name: Verify SkinUtil actually chooses Avatar overload in exact release
        shell: bash
        run: |
          javap -classpath "/tmp/skinlayers.jar:/tmp/transition.jar" -p -c -s dev.tr7zw.skinlayers.SkinUtil             | grep -A25 -B15 'PlayerUtil.getPlayerSkin:(Lnet/minecraft/class_11890;)'

      - name: Verify no duplicate latest Nexus JAR and immutable PRE14 checksum
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE14.jar"
          test "$(sha256sum "$J" | awk '{print $1}')" = "d63ac9ac90ebe9e71eee3e4ca77f34fca12e32c90a645bb07f97fed3adaa8034"
          find mods -maxdepth 1 -name 'NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE*.jar' -print
          test "$(find mods -maxdepth 1 -name 'NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE*.jar' | wc -l)" -eq 1
