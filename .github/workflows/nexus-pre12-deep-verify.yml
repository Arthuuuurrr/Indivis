name: Nexus PRE12 deep verify

on:
  push:
    paths:
      - ".github/workflows/nexus-pre12-deep-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Decompile exact PRE12 appearance paths
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE12.jar"
          curl -fsSL https://www.benf.org/other/cfr/cfr-0.152.jar -o /tmp/cfr.jar
          mkdir -p /tmp/d
          java -jar /tmp/cfr.jar "$J" --outputdir /tmp/d --silent true >/dev/null 2>&1

          for f in             /tmp/d/net/tompsen/nexuscharacters/RemoteAppearanceSupport.java             /tmp/d/net/tompsen/nexuscharacters/PresetSkinSupport.java             /tmp/d/net/tompsen/nexuscharacters/PreviewDummyPlayerManager.java             /tmp/d/net/tompsen/nexuscharacters/PreviewCosmeticContext.java             /tmp/d/net/tompsen/nexuscharacters/mixin/client/PlayerPresetSkinMixin.java             /tmp/d/net/tompsen/nexuscharacters/mixin/client/PlayerCosmeticStateMixin.java             /tmp/d/net/tompsen/nexuscharacters/mixin/client/PreviewDummyCosmeticMixin.java             /tmp/d/net/tompsen/nexuscharacters/mixin/client/CharacterPreviewCosmeticContextMixin.java             /tmp/d/net/tompsen/nexuscharacters/SkinLayersDynamicSkinBridge.java; do
            echo "===== $f ====="
            [ -f "$f" ] && cat "$f"
          done
