name: Nexus PRE9 compatibility inspect

on:
  push:
    paths:
      - ".github/workflows/nexus-pre9-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Reconstruct PRE5
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json
          root=Path("mods/nexuscharacters/releases/BETA-1.0-PRE5/parts")
          m=json.loads((root/"manifest.json").read_text())
          data=base64.b64decode("".join("".join((root/n).read_text().split()) for n in m["parts"]))
          assert hashlib.sha256(data).hexdigest()==m["artifact_sha256"]
          Path("/tmp/pre5.jar").write_bytes(data)
          PY
      - name: Inspect UnifiedPilosity ABI
        shell: bash
        run: |
          PRE8="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE8.jar"
          echo "=== PRE5 UnifiedPilositySupport ==="
          javap -classpath /tmp/pre5.jar -p net.tompsen.nexuscharacters.UnifiedPilositySupport
          echo "=== PRE8 UnifiedPilositySupport ==="
          javap -classpath "$PRE8" -p net.tompsen.nexuscharacters.UnifiedPilositySupport
          echo "=== PRE8 RacialAppearance69Support bytecode refs ==="
          javap -classpath "$PRE8" -p -c net.tompsen.nexuscharacters.RacialAppearance69Support | grep -n -A4 -B4 'UnifiedPilositySupport' || true
          echo "=== PRE8 all class constant-pool refs to UnifiedPilositySupport ==="
          unzip -Z1 "$PRE8" | grep '\.class$' | while read c; do
            name="${c%.class}"; name="${name//\//.}";
            out=$(javap -classpath "$PRE8" -p -c "$name" 2>/dev/null | grep 'UnifiedPilositySupport' || true)
            if [ -n "$out" ]; then
              echo "--- $name"
              echo "$out"
            fi
          done
