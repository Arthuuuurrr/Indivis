name: Nexus PRE9 compatibility inspect

on:
  push:
    paths:
      - ".github/workflows/nexus-pre9-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Reconstruct PRE5 and print exact allowsPilosity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json
          root=Path("mods/nexuscharacters/releases/BETA-1.0-PRE5/parts")
          m=json.loads((root/"manifest.json").read_text())
          data=base64.b64decode("".join("".join((root/n).read_text().split()) for n in m["parts"]))
          assert hashlib.sha256(data).hexdigest()==m["artifact_sha256"]
          Path("/tmp/pre5.jar").write_bytes(data)
          PY
          javap -classpath /tmp/pre5.jar -p -c net.tompsen.nexuscharacters.UnifiedPilositySupport             | sed -n '/public static boolean allowsPilosity/,/public static void fix/p'
