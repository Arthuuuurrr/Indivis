name: Nexus PRE12 cosmetic call inspect

on:
  push:
    paths:
      - ".github/workflows/nexus-pre12-cosmetic-call-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Find all CharacterCosmeticFeatureRenderer callers
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE11.jar"
          curl -fsSL https://www.benf.org/other/cfr/cfr-0.152.jar -o /tmp/cfr.jar
          mkdir -p /tmp/decomp
          java -jar /tmp/cfr.jar "$J" --outputdir /tmp/decomp --silent true >/dev/null 2>&1
          grep -Rni 'CharacterCosmeticFeatureRenderer' /tmp/decomp/net/tompsen/nexuscharacters || true
          echo "=== PlayerCosmeticStateMixin ==="
          cat /tmp/decomp/net/tompsen/nexuscharacters/mixin/client/PlayerCosmeticStateMixin.java
          echo "=== PreviewDummyCosmeticMixin ==="
          cat /tmp/decomp/net/tompsen/nexuscharacters/mixin/client/PreviewDummyCosmeticMixin.java
          echo "=== CharacterPreviewCosmeticContextMixin ==="
          cat /tmp/decomp/net/tompsen/nexuscharacters/mixin/client/CharacterPreviewCosmeticContextMixin.java
