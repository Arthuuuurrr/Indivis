name: Nexus PRE15 forensic verification

on:
  push:
    paths:
      - ".github/workflows/nexus-pre15-forensic.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify immutable PRE15 and critical class linkage
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE15.jar"
          test "$(sha256sum "$J" | awk '{print $1}')" =             "ae3c6b30ac7a2c75d1e92a44c2b76a1053c59ed2676d1c2dd3b658d3566f75af"
          unzip -t "$J" >/dev/null

          echo "=== LongHair classes present ==="
          jar tf "$J" | grep 'net/tompsen/nexuscharacters/LongHair3DRenderSupport'
          COUNT="$(jar tf "$J" | grep -c 'net/tompsen/nexuscharacters/LongHair3DRenderSupport.*\.class$')"
          test "$COUNT" -eq 1

          if unzip -p "$J" net/tompsen/nexuscharacters/LongHair3DRenderSupport.class             | strings | grep -F 'LongHair3DRenderSupport$HairParts'; then
            echo "Forbidden PRE14 HairParts reference remains."
            exit 1
          fi

          echo "=== BeardVoxelModelFactory ABI ==="
          javap -classpath "$J" -p -s net.tompsen.nexuscharacters.BeardVoxelModelFactory             | grep -A2 -F 'bake(net.tompsen.nexuscharacters.BeardVoxelModelFactory$Cuboid...)'

          echo "=== PRE15 callsites ==="
          javap -classpath "$J" -p -c net.tompsen.nexuscharacters.DynamicAppearanceSupport             | grep -A5 -B5 'LongHair3DRenderSupport.hairAssetName'
          javap -classpath "$J" -p -c net.tompsen.nexuscharacters.CharacterCosmeticFeatureRenderer             | grep -A5 -B5 'LongHair3DRenderSupport.render'

      - name: Download exact runtime mods used by the user
        shell: bash
        run: |
          curl -fL --retry 3             "https://github.com/tr7zw/3d-Skin-Layers/releases/download/1.10.2/skinlayers3d-fabric-1.10.2-mc1.21.11.jar"             -o /tmp/skinlayers.jar
          echo "736f076b9f45bab1c118166857f46729f782ddd481a0e4e4ee0bc110643f2756  /tmp/skinlayers.jar"             | sha256sum -c -

          curl -fL --retry 3             "https://github.com/tr7zw/EntityCulling/releases/download/1.10.2/entityculling-fabric-1.10.2-mc1.21.11.jar"             -o /tmp/entityculling.jar
          echo "01cdfc8021e7f59eeb5d0d1131b782d242ee677ddc53dc62484a06a1379fec59  /tmp/entityculling.jar"             | sha256sum -c -

          TRANSITION_ENTRY="$(jar tf /tmp/entityculling.jar | grep -Ei 'META-INF/jars/TRansition-1\.0\.19.*\.jar$' | head -n1)"
          test -n "$TRANSITION_ENTRY"
          unzip -p /tmp/entityculling.jar "$TRANSITION_ENTRY" > /tmp/transition.jar

          echo "=== Runtime API ==="
          javap -classpath /tmp/skinlayers.jar -p dev.tr7zw.skinlayers.api.MeshHelper             | grep -F 'create3DMesh'
          javap -classpath /tmp/skinlayers.jar -p dev.tr7zw.skinlayers.accessor.ModelPartInjector             | grep -F 'setInjectedMesh'
          javap -classpath /tmp/transition.jar -p -s dev.tr7zw.transition.mc.PlayerUtil             | grep -A2 -F 'getPlayerSkin(net.minecraft.class_11890)'

      - name: Verify exact official 1.10.2 mesh algorithm on PRE15 hair assets
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE15.jar"
          SRC=/tmp/official
          mkdir -p "$SRC/dev/tr7zw/skinlayers/versionless/util/wrapper"                    "$SRC/dev/tr7zw/skinlayers/versionless/util"

          BASEURL="https://raw.githubusercontent.com/tr7zw/3d-Skin-Layers/0f813f9e21367fc1eef0b04ca8de3113b2cc22ff"
          curl -fsSL "$BASEURL/3dSkinLayers-Versionless/src/main/java/dev/tr7zw/skinlayers/versionless/util/Direction.java"             -o "$SRC/dev/tr7zw/skinlayers/versionless/util/Direction.java"
          curl -fsSL "$BASEURL/3dSkinLayers-Versionless/src/main/java/dev/tr7zw/skinlayers/versionless/util/wrapper/ModelBuilder.java"             -o "$SRC/dev/tr7zw/skinlayers/versionless/util/wrapper/ModelBuilder.java"
          curl -fsSL "$BASEURL/3dSkinLayers-Versionless/src/main/java/dev/tr7zw/skinlayers/versionless/util/wrapper/TextureData.java"             -o "$SRC/dev/tr7zw/skinlayers/versionless/util/wrapper/TextureData.java"
          curl -fsSL "$BASEURL/3dSkinLayers-Versionless/src/main/java/dev/tr7zw/skinlayers/versionless/util/wrapper/SolidPixelWrapper.java"             -o "$SRC/dev/tr7zw/skinlayers/versionless/util/wrapper/SolidPixelWrapper.java"

          mkdir -p "$SRC/dev/tr7zw/skinlayers/versionless"
          cat > "$SRC/dev/tr7zw/skinlayers/versionless/ModBase.java" <<'JAVA'
          package dev.tr7zw.skinlayers.versionless;
          public final class ModBase {
              public static final Logger LOGGER = new Logger();
              public static final Config config = new Config();
              public static final class Logger {
                  public void error(String message, Exception ex) {
                      throw new RuntimeException(message, ex);
                  }
              }
              public static final class Config {
                  public boolean fastRender = true;
              }
          }
          JAVA

          mkdir -p /tmp/pre15-assets
          for raw in $(seq 1 13); do
            n=$(printf "%02d" "$raw")
            unzip -p "$J"               "assets/nexuscharacters/textures/cosmetic/hair_3d/hair_${n}.png"               > "/tmp/pre15-assets/hair_${n}.png"
          done

          cat > /tmp/OfficialMeshAudit.java <<'JAVA'
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;
          import dev.tr7zw.skinlayers.versionless.util.Direction;
          import dev.tr7zw.skinlayers.versionless.util.wrapper.*;

          public final class OfficialMeshAudit {
              static final class Img implements TextureData {
                  final BufferedImage image;
                  Img(BufferedImage image){ this.image=image; }
                  public boolean isPresent(SolidPixelWrapper.UV uv){
                      int p=image.getRGB(uv.u(),uv.v());
                      return ((p>>>24)&255)!=0;
                  }
                  public boolean isSolid(SolidPixelWrapper.UV uv){
                      int p=image.getRGB(uv.u(),uv.v());
                      return ((p>>>24)&255)==255;
                  }
                  public int getWidth(){ return image.getWidth(); }
                  public int getHeight(){ return image.getHeight(); }
              }
              static final class Builder implements ModelBuilder {
                  int pixelBoxes;
                  int vanillaBoxes;
                  public ModelBuilder textureSize(int w,int h){return this;}
                  public ModelBuilder uv(int u,int v){return this;}
                  public ModelBuilder mirror(boolean b){return this;}
                  public ModelBuilder addBox(float x,float y,float z,float s,Direction[] hide,Direction[][] corners){
                      pixelBoxes++; return this;
                  }
                  public ModelBuilder addVanillaBox(float x,float y,float z,float w,float h,float d){
                      vanillaBoxes++; return this;
                  }
                  public boolean isEmpty(){return pixelBoxes==0&&vanillaBoxes==0;}
              }
              static Builder run(BufferedImage img,int w,int h,int d,int u,int v,boolean top,float rot){
                  Builder b=new Builder();
                  ModelBuilder result=SolidPixelWrapper.wrapBox(b,new Img(img),w,h,d,u,v,top,rot);
                  if(result==null) throw new AssertionError("official wrapBox returned null");
                  return b;
              }
              public static void main(String[] args)throws Exception{
                  for(int hair=1;hair<=13;hair++){
                      BufferedImage img=ImageIO.read(new File(String.format("/tmp/pre15-assets/hair_%02d.png",hair)));
                      Builder head=run(img,8,8,8,32,0,false,0.6f);
                      if(head.pixelBoxes==0) throw new AssertionError("official HEAD mesh empty "+hair);
                      int bodyPixels=0;
                      if(hair>=6&&hair<=10){
                          Builder body=run(img,8,12,4,16,32,true,0f);
                          bodyPixels=body.pixelBoxes;
                          if(body.pixelBoxes==0) throw new AssertionError("official BODY mesh empty "+hair);
                      }
                      System.out.printf("hair_%02d official HEAD boxes=%d BODY boxes=%d%n",
                          hair,head.pixelBoxes,bodyPixels);
                  }
              }
          }
          JAVA

          javac -d /tmp/official-classes $(find "$SRC" -name '*.java') /tmp/OfficialMeshAudit.java
          java -cp /tmp/official-classes OfficialMeshAudit

      - name: Audit exact current hairstyle h07 hc02
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE15.jar"
          rm -rf /tmp/h07 && mkdir -p /tmp/h07
          unzip -p "$J"             assets/nexuscharacters/appearance_parts_v064/hair/hair_long_02.png             > /tmp/h07/original.png
          unzip -p "$J"             assets/nexuscharacters/appearance_parts_v064/hair/hair_long_02_pre13.png             > /tmp/h07/stripped.png
          unzip -p "$J"             assets/nexuscharacters/textures/cosmetic/hair_3d/hair_07.png             > /tmp/h07/mesh.png
          unzip -p "$J"             assets/nexuscharacters/textures/cosmetic/hair_3d_tinted/v69/hc02/hair_07.png             > /tmp/h07/tinted.png

          cat >/tmp/H07Audit.java <<'JAVA'
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;
          public final class H07Audit {
              static int count(BufferedImage i,int x0,int y0,int x1,int y1){
                  int c=0;for(int y=y0;y<y1;y++)for(int x=x0;x<x1;x++)
                    if(((i.getRGB(x,y)>>>24)&255)!=0)c++;return c;
              }
              public static void main(String[]a)throws Exception{
                  BufferedImage o=ImageIO.read(new File("/tmp/h07/original.png"));
                  BufferedImage s=ImageIO.read(new File("/tmp/h07/stripped.png"));
                  BufferedImage m=ImageIO.read(new File("/tmp/h07/mesh.png"));
                  BufferedImage t=ImageIO.read(new File("/tmp/h07/tinted.png"));
                  int originalTorso=count(o,16,32,40,48);
                  int strippedTorso=count(s,16,32,40,48);
                  int meshTorso=count(m,16,32,40,48);
                  int meshHead=count(m,32,0,64,16);
                  int tintedTorso=count(t,16,32,40,48);
                  System.out.printf(
                    "h07/hc02 originalTorso=%d strippedTorso=%d meshTorso=%d meshHead=%d tintedTorso=%d%n",
                    originalTorso,strippedTorso,meshTorso,meshHead,tintedTorso);
                  if(originalTorso==0) throw new AssertionError("source h07 torso unexpectedly empty");
                  if(strippedTorso!=0) throw new AssertionError("flat torso hair remains");
                  if(meshTorso!=originalTorso) throw new AssertionError("mesh torso differs from source");
                  if(meshHead==0) throw new AssertionError("mesh head empty");
                  if(tintedTorso!=meshTorso) throw new AssertionError("tinted alpha topology differs");
              }
          }
          JAVA
          javac /tmp/H07Audit.java
          java -cp /tmp H07Audit

      - name: Verify synchronous NativeImage consumption and separation math
        shell: bash
        run: |
          BASEURL="https://raw.githubusercontent.com/tr7zw/3d-Skin-Layers/0f813f9e21367fc1eef0b04ca8de3113b2cc22ff"
          curl -fsSL "$BASEURL/src/main/java/dev/tr7zw/skinlayers/api/SkinLayersAPI.java" -o /tmp/SkinLayersAPI.java
          curl -fsSL "$BASEURL/src/main/java/dev/tr7zw/skinlayers/api/OffsetProvider.java" -o /tmp/OffsetProvider.java
          curl -fsSL "$BASEURL/3dSkinLayers-Versionless/src/main/java/dev/tr7zw/skinlayers/versionless/config/Config.java" -o /tmp/Config.java

          # MeshHelperImplementation consumes the NativeImage synchronously through
          # WrappedNativeImage/SolidPixelWrapper before returning CustomizableModelPart.
          grep -F 'SolidPixelWrapper.wrapBox(builder, new WrappedNativeImage(natImage)' /tmp/SkinLayersAPI.java
          grep -F 'return new CustomizableModelPart' /tmp/SkinLayersAPI.java

          grep -F 'public float baseVoxelSize = 1.15f;' /tmp/Config.java
          grep -F 'public float bodyVoxelWidthSize = 1.05f;' /tmp/Config.java
          grep -F 'float heightScaling = 1.035f;' /tmp/OffsetProvider.java

          python - <<'PY'
          bx=1.05*1.16
          by=1.035*1.02
          bz=1.15*1.45
          print(f"PRE15 effective BODY scale: X={bx:.6f} Y={by:.6f} Z={bz:.6f}")
          assert bx > 1.20
          assert bz > 1.65
          assert bz - 1.15 > 0.50
          PY

      - name: Final PRE15 assertions
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE15.jar"
          unzip -p "$J" fabric.mod.json | grep -F '"version": "1.0.0-beta.15+hc.1.21.11"'
          unzip -p "$J" net/tompsen/nexuscharacters/LongHair3DRenderSupport.class             | strings | grep -F '[NexusCharacters] PRE15 dedicated 3D hair mesh active via 3D Skin Layers.'
          unzip -p "$J" net/tompsen/nexuscharacters/LongHair3DRenderSupport.class             | strings | grep -F '[NexusCharacters] PRE15 could not initialise 3D hair meshes:'
