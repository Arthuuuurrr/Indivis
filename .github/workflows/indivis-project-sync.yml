name: Indivis Project Sync

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/indivis-project-sync.yml"
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: indivis-project-sync
  cancel-in-progress: false

jobs:
  sync-project:
    runs-on: ubuntu-latest
    env:
      PROJECT_URL: ${{ vars.INDIVIS_PROJECT_URL }}
      PROJECT_TOKEN: ${{ secrets.INDIVIS_PROJECT_TOKEN }}
      REPO_TOKEN: ${{ github.token }}

    steps:
      - name: Bootstrap and synchronize Project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${PROJECT_URL}" || -z "${PROJECT_TOKEN}" ]]; then
            echo "::notice::Project automation is installed but inactive. Configure INDIVIS_PROJECT_URL and INDIVIS_PROJECT_TOKEN."
            exit 0
          fi

          if [[ ! "${PROJECT_URL}" =~ ^https://github.com/users/([^/]+)/projects/([0-9]+)/?$ ]]; then
            echo "::error::INDIVIS_PROJECT_URL must look like https://github.com/users/OWNER/projects/NUMBER"
            exit 1
          fi

          PROJECT_OWNER="${BASH_REMATCH[1]}"
          PROJECT_NUMBER="${BASH_REMATCH[2]}"
          PROJECT_ROOT="users/${PROJECT_OWNER}/projectsV2/${PROJECT_NUMBER}"
          REPO_OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          project_api() {
            GH_TOKEN="${PROJECT_TOKEN}" gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" "$@"
          }

          repo_api() {
            GH_TOKEN="${REPO_TOKEN}" gh api "$@"
          }

          echo "Using Project ${PROJECT_OWNER} #${PROJECT_NUMBER}"
          project_api "${PROJECT_ROOT}" >/dev/null

          FIELDS_JSON="$(project_api "${PROJECT_ROOT}/fields?per_page=100")"

          field_exists() {
            local name="$1"
            jq -e --arg name "$name" '.[] | select(.name == $name)' <<<"${FIELDS_JSON}" >/dev/null
          }

          refresh_fields() {
            FIELDS_JSON="$(project_api "${PROJECT_ROOT}/fields?per_page=100")"
          }

          create_select_field() {
            local name="$1"
            local options_json="$2"
            if ! field_exists "$name"; then
              echo "Creating field: $name"
              jq -nc --arg name "$name" --argjson options "$options_json" \
                '{name:$name,data_type:"single_select",single_select_options:$options}' | \
                project_api --method POST "${PROJECT_ROOT}/fields" --input - >/dev/null
              refresh_fields
            fi
          }

          create_simple_field() {
            local name="$1"
            local type="$2"
            if ! field_exists "$name"; then
              echo "Creating field: $name"
              jq -nc --arg name "$name" --arg type "$type" \
                '{name:$name,data_type:$type}' | \
                project_api --method POST "${PROJECT_ROOT}/fields" --input - >/dev/null
              refresh_fields
            fi
          }

          create_select_field "Avancement" '[
            {"name":"Backlog","color":"GRAY","description":"À qualifier ou planifier"},
            {"name":"À faire","color":"BLUE","description":"Prêt à être pris"},
            {"name":"En cours","color":"YELLOW","description":"Travail actif"},
            {"name":"Validation en jeu","color":"PURPLE","description":"À tester en conditions réelles"},
            {"name":"Bloqué","color":"RED","description":"Dépendance ou problème bloquant"},
            {"name":"Terminé","color":"GREEN","description":"Validé et terminé"}
          ]'

          create_select_field "Priorité" '[
            {"name":"P0 Critique","color":"RED","description":"Bloquant immédiat"},
            {"name":"P1 Haute","color":"ORANGE","description":"Haute priorité"},
            {"name":"P2 Normale","color":"YELLOW","description":"Priorité normale"},
            {"name":"P3 Basse","color":"BLUE","description":"Peut attendre"},
            {"name":"P4 Long terme","color":"GRAY","description":"Roadmap long terme"},
            {"name":"Non priorisé","color":"GRAY","description":"À classer"}
          ]'

          create_select_field "Catégorie" '[
            {"name":"Bug","color":"RED","description":"Correction"},
            {"name":"Intégration","color":"PURPLE","description":"Interopérabilité"},
            {"name":"Roadmap","color":"BLUE","description":"Fonctionnalité planifiée"},
            {"name":"World","color":"GREEN","description":"Monde et biomes"},
            {"name":"Items","color":"YELLOW","description":"Objets et équipements"},
            {"name":"Polish","color":"PINK","description":"Finition et UX"},
            {"name":"Tech","color":"GRAY","description":"Infrastructure technique"},
            {"name":"Balance","color":"ORANGE","description":"Équilibrage"},
            {"name":"Combat","color":"RED","description":"Combat"},
            {"name":"Donjon","color":"PURPLE","description":"Donjons"},
            {"name":"Gameplay","color":"BLUE","description":"Gameplay"},
            {"name":"Performance","color":"YELLOW","description":"Performances"},
            {"name":"Audio","color":"PINK","description":"Audio et musiques"},
            {"name":"Quête","color":"GREEN","description":"Quêtes"},
            {"name":"Autre","color":"GRAY","description":"Autre"}
          ]'

          create_simple_field "Start date" "date"
          create_simple_field "Target date" "date"
          create_simple_field "Version cible" "text"

          ensure_repo_label() {
            local name="$1"
            local color="$2"
            local description="$3"
            GH_TOKEN="${REPO_TOKEN}" gh label create "$name" --repo "${GITHUB_REPOSITORY}" \
              --color "$color" --description "$description" --force >/dev/null
          }

          ensure_repo_label "status:backlog" "6E7781" "Roadmap: backlog"
          ensure_repo_label "status:todo" "1F6FEB" "Roadmap: à faire"
          ensure_repo_label "status:in-progress" "D29922" "Roadmap: en cours"
          ensure_repo_label "status:verify" "8250DF" "Roadmap: validation en jeu"
          ensure_repo_label "status:blocked" "CF222E" "Roadmap: bloqué"
          ensure_repo_label "priority:P0" "B60205" "Priorité critique"
          ensure_repo_label "priority:P1" "D93F0B" "Priorité haute"
          ensure_repo_label "priority:P2" "FBCA04" "Priorité normale"
          ensure_repo_label "priority:P3" "0E8A16" "Priorité basse"
          ensure_repo_label "priority:P4" "6E7781" "Priorité long terme"

          field_id() {
            local name="$1"
            jq -r --arg name "$name" '.[] | select(.name == $name) | .id' <<<"${FIELDS_JSON}" | head -n1
          }

          option_id() {
            local field_name="$1"
            local option_name="$2"
            jq -r --arg field "$field_name" --arg option "$option_name" '
              .[]
              | select(.name == $field)
              | .options[]
              | select((.name.raw // .name) == $option)
              | .id
            ' <<<"${FIELDS_JSON}" | head -n1
          }

          AVANCEMENT_FIELD_ID="$(field_id "Avancement")"
          PRIORITE_FIELD_ID="$(field_id "Priorité")"
          CATEGORIE_FIELD_ID="$(field_id "Catégorie")"

          create_views_if_needed() {
            local existing_views view_root

            existing_views="$(GH_TOKEN="${PROJECT_TOKEN}" gh api graphql \
              -f query='query($login:String!,$number:Int!){user(login:$login){projectV2(number:$number){views(first:100){nodes{name}}}}}' \
              -f login="${PROJECT_OWNER}" -F number="${PROJECT_NUMBER}" \
              --jq '.data.user.projectV2.views.nodes[].name')"

            view_root="users/${PROJECT_OWNER}/projectsV2/${PROJECT_NUMBER}/views"

            if ! grep -Fxq "Kanban" <<<"${existing_views}"; then
              echo "Creating view: Kanban"
              jq -nc --argjson field "${AVANCEMENT_FIELD_ID}" \
                '{name:"Kanban",layout:"board",filter:"is:issue",vertical_group_by:[$field]}' | \
                project_api --method POST "${view_root}" --input - >/dev/null
            fi

            if ! grep -Fxq "Roadmap" <<<"${existing_views}"; then
              echo "Creating view: Roadmap"
              jq -nc '{name:"Roadmap",layout:"roadmap",filter:"is:issue"}' | \
                project_api --method POST "${view_root}" --input - >/dev/null
            fi

            if ! grep -Fxq "Priorités" <<<"${existing_views}"; then
              echo "Creating view: Priorités"
              jq -nc --argjson field "${PRIORITE_FIELD_ID}" \
                '{name:"Priorités",layout:"table",filter:"is:issue",group_by:[$field]}' | \
                project_api --method POST "${view_root}" --input - >/dev/null
            fi
          }

          status_for_issue() {
            local title="$1"
            local state="$2"
            local labels="$3"

            if [[ "$state" == "closed" ]]; then
              echo "Terminé"
            elif grep -qiE '(^|,)(status:blocked|blocked)(,|$)' <<<"$labels" || grep -qi '\[BLOCKED\]' <<<"$title"; then
              echo "Bloqué"
            elif grep -qiE '(^|,)(status:verify|verify)(,|$)' <<<"$labels" || grep -qi '\[VERIFY\]' <<<"$title"; then
              echo "Validation en jeu"
            elif grep -qiE '(^|,)(status:in-progress|wip)(,|$)' <<<"$labels" || grep -qi '\[WIP\]' <<<"$title"; then
              echo "En cours"
            elif grep -qiE '(^|,)(status:todo|todo)(,|$)' <<<"$labels" || grep -qi '\[TODO\]' <<<"$title"; then
              echo "À faire"
            elif grep -qiE '(^|,)(status:backlog|triage)(,|$)' <<<"$labels" || grep -qi '\[TRIAGE\]' <<<"$title"; then
              echo "Backlog"
            else
              echo "Backlog"
            fi
          }

          priority_for_issue() {
            local title="$1"
            local labels="$2"

            for n in 0 1 2 3 4; do
              if grep -qiE "(^|,)(priority:)?P${n}(,|$)" <<<"$labels" || grep -qi "\[P${n}\]" <<<"$title"; then
                case "$n" in
                  0) echo "P0 Critique" ;;
                  1) echo "P1 Haute" ;;
                  2) echo "P2 Normale" ;;
                  3) echo "P3 Basse" ;;
                  4) echo "P4 Long terme" ;;
                esac
                return 0
              fi
            done

            echo "Non priorisé"
          }

          category_for_issue() {
            local title="$1"

            if grep -qi '\[BUG\]' <<<"$title"; then echo "Bug"
            elif grep -qi '\[INTEGRATION\]' <<<"$title"; then echo "Intégration"
            elif grep -qi '\[ROADMAP\]' <<<"$title"; then echo "Roadmap"
            elif grep -qi '\[WORLD\]' <<<"$title"; then echo "World"
            elif grep -qi '\[ITEMS\]' <<<"$title"; then echo "Items"
            elif grep -qi '\[POLISH\]' <<<"$title"; then echo "Polish"
            elif grep -qi '\[TECH\]' <<<"$title"; then echo "Tech"
            elif grep -qi '\[BALANCE\]' <<<"$title"; then echo "Balance"
            elif grep -qi '\[COMBAT\]' <<<"$title"; then echo "Combat"
            elif grep -qiE '\[(DUNGEON|DONJON)\]' <<<"$title"; then echo "Donjon"
            elif grep -qi '\[GAMEPLAY\]' <<<"$title"; then echo "Gameplay"
            elif grep -qi '\[PERFORMANCE\]' <<<"$title"; then echo "Performance"
            elif grep -qi '\[AUDIO\]' <<<"$title"; then echo "Audio"
            elif grep -qi '\[QUEST\]' <<<"$title"; then echo "Quête"
            else echo "Autre"
            fi
          }

          PROJECT_ITEMS_JSON="$(project_api "${PROJECT_ROOT}/items?per_page=100")"

          sync_issue() {
            local url="$1"
            local number="${url##*/}"
            local issue_json issue_id title state labels item_id add_response
            local advancement priority category advancement_option priority_option category_option update_payload

            issue_json="$(repo_api "repos/${GITHUB_REPOSITORY}/issues/${number}")"

            if jq -e '.pull_request != null' <<<"$issue_json" >/dev/null; then
              return 0
            fi

            issue_id="$(jq -r '.id' <<<"$issue_json")"
            title="$(jq -r '.title' <<<"$issue_json")"
            state="$(jq -r '.state' <<<"$issue_json")"
            labels="$(jq -r '[.labels[].name] | join(",")' <<<"$issue_json")"

            item_id="$(jq -r --argjson issue_id "$issue_id" '
              .[] | select(.content.id == $issue_id) | .id
            ' <<<"${PROJECT_ITEMS_JSON}" | head -n1)"

            if [[ -z "$item_id" || "$item_id" == "null" ]]; then
              echo "Adding issue #${number} to Project"

              if ! add_response="$(jq -nc --argjson id "$issue_id" '{type:"Issue",id:$id}' | \
                project_api --method POST "${PROJECT_ROOT}/items" --input - 2>&1)"; then
                first_add_error="$add_response"
                echo "Add by internal issue ID failed; trying repository coordinates."

                if ! add_response="$(jq -nc \
                  --arg owner "${REPO_OWNER}" \
                  --arg repo "${REPO_NAME}" \
                  --argjson number "$number" \
                  '{type:"Issue",owner:$owner,repo:$repo,number:$number}' | \
                  project_api --method POST "${PROJECT_ROOT}/items" --input - 2>&1)"; then

                  if ! GH_TOKEN="${PROJECT_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}/issues/${number}" >/dev/null 2>&1; then
                    echo "::error::INDIVIS_PROJECT_TOKEN can manage the Project but cannot read the private repository. Edit the classic PAT and enable the repo scope, then update the INDIVIS_PROJECT_TOKEN secret."
                  else
                    echo "::error::GitHub rejected issue #${number} while adding it to the Project."
                    echo "First attempt: $first_add_error"
                    echo "Fallback attempt: $add_response"
                  fi
                  return 1
                fi
              fi

              item_id="$(jq -r '.value.id // empty' <<<"$add_response")"
              if [[ -z "$item_id" ]]; then
                PROJECT_ITEMS_JSON="$(project_api "${PROJECT_ROOT}/items?per_page=100")"
                item_id="$(jq -r --argjson issue_id "$issue_id" '.[] | select(.content.id == $issue_id) | .id' <<<"${PROJECT_ITEMS_JSON}" | head -n1)"
              else
                PROJECT_ITEMS_JSON="$(jq --argjson item "$(jq -c '.value' <<<"$add_response")" '. + [$item]' <<<"${PROJECT_ITEMS_JSON}")"
              fi

              if [[ -z "$item_id" || "$item_id" == "null" ]]; then
                echo "::error::Issue #${number} was not returned as a Project item after insertion."
                return 1
              fi
            fi

            advancement="$(status_for_issue "$title" "$state" "$labels")"
            priority="$(priority_for_issue "$title" "$labels")"
            category="$(category_for_issue "$title")"

            advancement_option="$(option_id "Avancement" "$advancement")"
            priority_option="$(option_id "Priorité" "$priority")"
            category_option="$(option_id "Catégorie" "$category")"

            update_payload="$(jq -nc \
              --argjson advancement_field "${AVANCEMENT_FIELD_ID}" \
              --arg advancement_value "$advancement_option" \
              --argjson priority_field "${PRIORITE_FIELD_ID}" \
              --arg priority_value "$priority_option" \
              --argjson category_field "${CATEGORIE_FIELD_ID}" \
              --arg category_value "$category_option" \
              '{fields:[
                {id:$advancement_field,value:$advancement_value},
                {id:$priority_field,value:$priority_value},
                {id:$category_field,value:$category_value}
              ]}')"

            project_api --method PATCH "${PROJECT_ROOT}/items/${item_id}" \
              --input - <<<"$update_payload" >/dev/null

            echo "#${number}: $advancement | $priority | $category"
          }

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_EVENT_NAME}" == "push" ]]; then
            create_views_if_needed

            mapfile -t ISSUE_URLS < <(
              GH_TOKEN="${REPO_TOKEN}" gh issue list --repo "${GITHUB_REPOSITORY}" \
                --state all --limit 1000 --json url --jq '.[].url'
            )

            for url in "${ISSUE_URLS[@]}"; do
              sync_issue "$url"
            done
          else
            sync_issue "${{ github.event.issue.html_url }}"
          fi
