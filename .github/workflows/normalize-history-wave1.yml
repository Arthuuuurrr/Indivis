name: Normalize history wave 1 to LFS

on:
  push:
    branches:
      - artifacts/history-wave-1
    paths:
      - '.normalize-history-wave1'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: artifacts/history-wave-1
          lfs: false
          fetch-depth: 0
      - name: Convert new historical JARs to Git LFS
        shell: bash
        run: |
          set -euo pipefail
          git lfs install
          files=(
            "artifacts/jars/spell-power/spell_power-fabric-1.6.1.001+1.21.11-HC-HAZENN-PRECISE-TEST3-RC1.jar"
            "artifacts/jars/spell-power/spell_power-fabric-1.6.1.001+1.21.11-HC-HAZENN-PRECISE-TEST3-RC2.jar"
            "artifacts/jars/spell-power/spell_power-fabric-1.6.1.001+1.21.11-HC-HAZENN-PRECISE-TEST3-RC6.jar"
            "artifacts/jars/capitale-rp-hud/capitale_rp_hud_BETA_1_2_9_NEXUS_AUTHORITY_1_21_11.jar"
            "artifacts/jars/haute-capitale-rpg/haute-capitale-rpg-0.3.0+1.21.11.b2.HC.TEST3.RC1.jar"
          )
          git add --renormalize "${files[@]}"
          rm -f .normalize-history-wave1 .github/workflows/normalize-history-wave1.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "artifacts: normalize history wave 1 to Git LFS"
          git push origin HEAD:artifacts/history-wave-1
