name: Build and validate Haute Capitale 40m day cycle # retry 2

on:
  push:
    paths:
      - ".github/workflows/build-daycycle-40m.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build remapped Fabric JAR
        working-directory: sources/capitale-daycycle
        run: gradle clean build --stacktrace

      - name: Start development server
        working-directory: sources/capitale-daycycle
        shell: bash
        run: |
          mkdir -p run
          cat > run/eula.txt <<'EOF'
          eula=true
          EOF
          cat > run/server.properties <<'EOF'
          online-mode=false
          server-port=25566
          enable-rcon=true
          rcon.port=25575
          rcon.password=hc40mtest
          view-distance=2
          simulation-distance=2
          sync-chunk-writes=false
          max-tick-time=-1
          motd=HC40M runtime test
          EOF
          gradle runServer --args nogui > run-server.log 2>&1 &
          echo $! > gradle-server.pid

      - name: Wait for server
        working-directory: sources/capitale-daycycle
        shell: bash
        run: |
          for i in $(seq 1 120); do
            if grep -q "Done (" run-server.log; then
              exit 0
            fi
            if ! kill -0 "$(cat gradle-server.pid)" 2>/dev/null; then
              cat run-server.log
              exit 1
            fi
            sleep 1
          done
          cat run-server.log
          exit 1

      - name: Runtime verify dayTime 0.5x and gameTime 1.0x
        working-directory: sources/capitale-daycycle
        shell: bash
        run: |
          python - <<'PY'
          import re, socket, struct, time

          HOST, PORT, PASSWORD = "127.0.0.1", 25575, "hc40mtest"

          def packet(packet_id, packet_type, payload):
              data = struct.pack("<ii", packet_id, packet_type) + payload.encode("utf-8") + b"\x00\x00"
              return struct.pack("<i", len(data)) + data

          def recv_packet(sock):
              raw = sock.recv(4)
              if len(raw) != 4:
                  raise RuntimeError("RCON: missing packet length")
              (length,) = struct.unpack("<i", raw)
              data = b""
              while len(data) < length:
                  chunk = sock.recv(length - len(data))
                  if not chunk:
                      raise RuntimeError("RCON: connection closed")
                  data += chunk
              packet_id, packet_type = struct.unpack("<ii", data[:8])
              payload = data[8:-2].decode("utf-8", errors="replace")
              return packet_id, packet_type, payload

          with socket.create_connection((HOST, PORT), timeout=10) as s:
              s.sendall(packet(1, 3, PASSWORD))
              rid, rtype, msg = recv_packet(s)
              if rid == -1:
                  raise RuntimeError("RCON authentication failed")

              seq = 10
              def cmd(command):
                  nonlocal_seq = None
                  global seq
                  seq += 1
                  s.sendall(packet(seq, 2, command))
                  rid, rtype, payload = recv_packet(s)
                  if rid != seq:
                      raise RuntimeError(f"Unexpected RCON id {rid}, wanted {seq}")
                  return payload

              def last_int(text):
                  nums = re.findall(r"-?\d+", text.replace(",", ""))
                  if not nums:
                      raise RuntimeError(f"No integer in RCON response: {text!r}")
                  return int(nums[-1])

              rule_before = cmd("gamerule doDaylightCycle")
              random_before = cmd("gamerule randomTickSpeed")
              cmd("time set 0")
              time.sleep(1.0)

              day0 = last_int(cmd("time query daytime"))
              game0 = last_int(cmd("time query gametime"))
              t0 = time.monotonic()
              time.sleep(10.0)
              day1 = last_int(cmd("time query daytime"))
              game1 = last_int(cmd("time query gametime"))
              elapsed = time.monotonic() - t0

              rule_after = cmd("gamerule doDaylightCycle")
              random_after = cmd("gamerule randomTickSpeed")

              day_delta = (day1 - day0) % 24000
              game_delta = game1 - game0
              ratio = day_delta / game_delta if game_delta else 0.0

              print({
                  "elapsed_seconds": elapsed,
                  "day0": day0, "day1": day1, "day_delta": day_delta,
                  "game0": game0, "game1": game1, "game_delta": game_delta,
                  "ratio": ratio,
                  "doDaylightCycle_before": rule_before,
                  "doDaylightCycle_after": rule_after,
                  "randomTickSpeed_before": random_before,
                  "randomTickSpeed_after": random_after,
              })

              if not 160 <= game_delta <= 260:
                  raise SystemExit(f"gameTime did not remain near 20 TPS: delta={game_delta}")
              if not 0.45 <= ratio <= 0.55:
                  raise SystemExit(f"timeOfDay ratio is not 0.5x: day={day_delta}, game={game_delta}, ratio={ratio}")
              if "true" not in rule_before.lower() or "true" not in rule_after.lower():
                  raise SystemExit("doDaylightCycle was not left enabled/unchanged")
              if last_int(random_before) != 3 or last_int(random_after) != 3:
                  raise SystemExit("randomTickSpeed changed unexpectedly")

              cmd("stop")
          PY

      - name: Verify clean server shutdown and no Mixin failure
        working-directory: sources/capitale-daycycle
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if ! kill -0 "$(cat gradle-server.pid)" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if grep -Eqi "Mixin apply failed|InjectionError|InvalidInjectionException|MixinTransformerError" run-server.log; then
            cat run-server.log
            exit 1
          fi
          tail -n 80 run-server.log

      - name: Publish validated JAR into repository
        shell: bash
        run: |
          JAR=$(find sources/capitale-daycycle/build/libs -maxdepth 1 -type f -name 'HauteCapitale-DayCycle-1.21.11-1.0.0.jar' | head -n1)
          test -n "$JAR"
          test -f "$JAR"
          DEST="mods/HauteCapitale-DayCycle-1.21.11-1.0.0.jar"
          cp "$JAR" "$DEST"
          SHA=$(sha256sum "$DEST" | awk '{print $1}')
          SIZE=$(stat -c%s "$DEST")
          cat > docs/mods/HAUTE_CAPITALE_DAYCYCLE_40M_1_0_0.md <<EOF
          # Haute Capitale Day Cycle 1.0.0

          - Minecraft: 1.21.11
          - Fabric Loader: >= 0.19.5
          - Serveur uniquement
          - JAR: \`$DEST\`
          - Taille: **$SIZE octets**
          - SHA-256: \`$SHA\`

          ## Comportement validé

          Le Mixin intervient uniquement sur l'argument de \`ServerWorld.tickTime() -> ServerWorldProperties.setTimeOfDay(long)\`.

          - \`timeOfDay\` automatique: **0,5x**
          - \`gameTime\`: **1,0x**
          - cycle complet à 20 TPS: **~40 minutes**
          - \`doDaylightCycle\`: inchangé
          - \`randomTickSpeed\`: inchangé
          - \`/time\` et les sauts de temps hors incrément automatique: non interceptés

          Le test runtime GitHub Actions mesure simultanément \`time query daytime\` et \`time query gametime\` sur 10 secondes et exige un ratio compris entre 0,45 et 0,55.

          Source: \`sources/capitale-daycycle/\`.
          EOF
          printf '%s  %s\n' "$SHA" "$(basename "$DEST")" > mods/HauteCapitale-DayCycle-1.21.11-1.0.0.SHA256.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST" mods/HauteCapitale-DayCycle-1.21.11-1.0.0.SHA256.txt docs/mods/HAUTE_CAPITALE_DAYCYCLE_40M_1_0_0.md
          git commit -m "daycycle: publish validated 40-minute server mod"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
