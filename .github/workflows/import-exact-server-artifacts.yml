name: Import exact server artifacts

on:
  push:
    branches: [main]
    paths:
      - '.import-staging/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Reconstruct verified source payloads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib, json

          root=Path('.import-staging')
          out=Path('.import-reconstructed')
          out.mkdir(exist_ok=True)

          expected={
            'core.zip':'e5b06cd7ae0b9356782c30e3813a3170605a4ec20276edf0789c54331905b521',
            'skills.zip':'109ec0428909c009d6599637cc0b23a90c78bd84c9d5772c6447ecf01a3d34f4',
            'abilities.zip':'ba6b9b429859d292ea26dd264574638c0df3d1b0e0898f8ee913da141e32e85d',
            'creatures010.zip':'5ec4a277bf88a4b7c38aceb9d8a2342851f0a3753ac20ac232573b29787a2099',
            'currency.jar':'a0158a061a5c5fbb2befcb1de5201198066db41ddf8a94f4b099dc115a7fad34',
            'weapons.jar':'c5d0c59d054af7496d725458edafd622a9f0de12554e28b41676d54452d32f9c',
          }

          for name, sha in expected.items():
              parts=sorted(root.glob(name+'.b85.*'))
              if not parts:
                  raise SystemExit(f'missing payload parts for {name}')
              encoded=''.join(p.read_text() for p in parts)
              raw=lzma.decompress(base64.b85decode(encoded.encode('ascii')))
              got=hashlib.sha256(raw).hexdigest()
              if got != sha:
                  raise SystemExit(f'{name}: sha256 mismatch {got} != {sha}')
              (out/name).write_bytes(raw)
              print(f'{name}: {len(raw)} bytes sha256={got}')
          PY

      - name: Expand full deployed datapacks
        shell: bash
        run: |
          set -euo pipefail

          rm -rf datapacks/capitale-core
          rm -rf datapacks/capitale-skills
          rm -rf datapacks/capitale-creatures-biomes
          rm -rf datapacks/capitale-abilities

          mkdir -p datapacks/capitale-core
          mkdir -p datapacks/capitale-skills
          mkdir -p datapacks/capitale-creatures-biomes
          mkdir -p datapacks/capitale-abilities

          unzip -q .import-reconstructed/core.zip -d datapacks/capitale-core
          unzip -q .import-reconstructed/skills.zip -d datapacks/capitale-skills
          unzip -q .import-reconstructed/creatures010.zip -d datapacks/capitale-creatures-biomes
          unzip -q .import-reconstructed/abilities.zip -d datapacks/capitale-abilities

          cat > datapacks/capitale-core/README_GIT_IMPORT.md <<'EOF'
          # Git import
          Exact deployed snapshot: **capitale_core 1.5.6-RC9AO**.
          Source SHA-256: `e5b06cd7ae0b9356782c30e3813a3170605a4ec20276edf0789c54331905b521`.
          EOF

          cat > datapacks/capitale-skills/README_GIT_IMPORT.md <<'EOF'
          # Git import
          Exact deployed snapshot: **capitale_skills 0.10.19-RC2F TREE HARD RESTORE**.
          Source SHA-256: `109ec0428909c009d6599637cc0b23a90c78bd84c9d5772c6447ecf01a3d34f4`.
          EOF

          cat > datapacks/capitale-creatures-biomes/README_GIT_IMPORT.md <<'EOF'
          # Git import
          Exact deployed snapshot: **capitale_creatures_biomes BETA 0.10**.
          Source SHA-256: `5ec4a277bf88a4b7c38aceb9d8a2342851f0a3753ac20ac232573b29787a2099`.
          BETA 0.12 is newer source work but is not kept here because it was not confirmed deployed.
          EOF

          cat > datapacks/capitale-abilities/README_GIT_IMPORT.md <<'EOF'
          # Git import
          Exact server archive imported from `capitale_abilities.zip`.
          Source SHA-256: `ba6b9b429859d292ea26dd264574638c0df3d1b0e0898f8ee913da141e32e85d`.
          EOF

      - name: Add exact server JARs through Git LFS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/jars/capitale-currency
          mkdir -p artifacts/jars/capitale-weapons-standalone

          cp .import-reconstructed/currency.jar             artifacts/jars/capitale-currency/capitale_currency_BETA_1_0_hotfix5_bourse50_stack99_legacy_style_1_21_11.jar

          cp .import-reconstructed/weapons.jar             artifacts/jars/capitale-weapons-standalone/capitale_weapons_standalone-0.5.0-gameplay-stats.jar

          git lfs install --local

      - name: Remove staging payloads and commit import
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .import-staging .import-reconstructed

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "artifacts: import exact deployed JARs and full datapacks"
          git push

      - name: Verify resulting working tree JARs
        shell: bash
        run: |
          set -euo pipefail
          for jar in             artifacts/jars/capitale-currency/*.jar             artifacts/jars/capitale-weapons-standalone/*.jar
          do
            test "$(head -c 2 "$jar")" = "PK"
            test "$(stat -c '%s' "$jar")" -gt 1024
          done
