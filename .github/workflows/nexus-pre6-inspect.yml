name: Nexus PRE6 inspect

on:
  push:
    paths:
      - ".github/workflows/nexus-pre6-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct PRE5
        shell: bash
        run: |
          python mods/nexuscharacters/releases/BETA-1.0-PRE5/parts/assemble_pre5.py
          J=mods/mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE5.jar
          test -s "$J"
          unzip -t "$J" >/dev/null
      - name: Inspect creation layout
        shell: bash
        run: |
          J=mods/mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE5.jar
          javap -classpath "$J" -p -c -constants net.tompsen.nexuscharacters.mixin.client.CharacterCreationAppearance65Mixin > /tmp/layout.txt
          echo "=== SIGNATURES/FIELDS ==="
          javap -classpath "$J" -p net.tompsen.nexuscharacters.mixin.client.CharacterCreationAppearance65Mixin
          echo "=== COSMETIC BUTTON CONTEXT ==="
          grep -n -C 45 'nexuscharacters\$cosmeticButton' /tmp/layout.txt || true
          echo "=== INIT/REFRESH/LAMBDA CONTEXT ==="
          grep -n -E -C 12 'init|refresh|lambda|method_37063|method_25355|Button' /tmp/layout.txt | head -n 700 || true
      - name: Inspect PRE5 beard geometry
        shell: bash
        run: |
          J=mods/mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE5.jar
          javap -classpath "$J" -p -c -constants net.tompsen.nexuscharacters.LongBeardModelSupport > /tmp/beard.txt
          echo "=== BEARD SIGNATURES ==="
          javap -classpath "$J" -p net.tompsen.nexuscharacters.LongBeardModelSupport
          echo "=== CREATE CUSTOM ==="
          sed -n '/private static java.lang.Object createCustom/,/^}/p' /tmp/beard.txt
