name: Nexus PRE6 inspect

on:
  push:
    paths:
      - ".github/workflows/nexus-pre6-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct PRE5
        shell: bash
        run: |
          python mods/nexuscharacters/releases/BETA-1.0-PRE5/parts/assemble_pre5.py
          J=mods/mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE5.jar
          test -s "$J"
          unzip -t "$J" >/dev/null
      - name: Targeted layout inspection
        shell: bash
        run: |
          J=mods/mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE5.jar
          for C in             net.tompsen.nexuscharacters.mixin.client.CharacterCreationAppearance65Mixin             net.tompsen.nexuscharacters.mixin.client.CharacterCreationCosmeticMixin; do
            javap -classpath "$J" -p -c -constants "$C" > "/tmp/$(basename "$C").txt"
          done
          echo "=== COSMETIC MIXIN SIGNATURES ==="
          javap -classpath "$J" -p net.tompsen.nexuscharacters.mixin.client.CharacterCreationCosmeticMixin
          echo "=== APPEARANCE LAYOUT METHOD ==="
          awk '/private void nexuscharacters\$layoutEverything\(\);/{p=1} p{print} p && /^  private static void placeName/{exit}' /tmp/net.tompsen.nexuscharacters.mixin.client.CharacterCreationAppearance65Mixin.txt
          echo "=== COSMETIC MIXIN FULL ==="
          cat /tmp/net.tompsen.nexuscharacters.mixin.client.CharacterCreationCosmeticMixin.txt
      - name: Decompile relevant PRE5 classes
        shell: bash
        run: |
          J=mods/mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE5.jar
          curl -fsSL https://www.benf.org/other/cfr/cfr-0.152.jar -o /tmp/cfr.jar
          mkdir -p /tmp/decomp
          java -jar /tmp/cfr.jar "$J" --outputdir /tmp/decomp --silent true >/dev/null 2>&1
          echo "=== LONG BEARD SOURCE ==="
          cat /tmp/decomp/net/tompsen/nexuscharacters/LongBeardModelSupport.java
          echo "=== COSMETIC MIXIN SOURCE ==="
          cat /tmp/decomp/net/tompsen/nexuscharacters/mixin/client/CharacterCreationCosmeticMixin.java
          echo "=== APPEARANCE MIXIN LAYOUT SNIPPET ==="
          grep -n -A180 -B20 'layoutEverything' /tmp/decomp/net/tompsen/nexuscharacters/mixin/client/CharacterCreationAppearance65Mixin.java | tail -n 240
