name: Nexus PRE6 inspect

on:
  push:
    paths:
      - ".github/workflows/nexus-pre6-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct PRE5
        shell: bash
        run: |
          python mods/nexuscharacters/releases/BETA-1.0-PRE5/parts/assemble_pre5.py
          ls -lh mods/mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE5.jar
      - name: List relevant classes
        shell: bash
        run: |
          jar tf mods/mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE5.jar | grep -E 'RacialAppearance|CharacterCreationAppearance|LongBeardModelSupport|CulturalBeardUiSupport|UnifiedPilositySupport' || true
      - name: Disassemble layout classes
        shell: bash
        run: |
          J=mods/mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE5.jar
          for C in             net.tompsen.nexuscharacters.RacialAppearance69Support             net.tompsen.nexuscharacters.mixin.client.CharacterCreationAppearance65Mixin             net.tompsen.nexuscharacters.LongBeardModelSupport             net.tompsen.nexuscharacters.CulturalBeardUiSupport; do
            echo "===== $C ====="
            javap -classpath "$J" -p -c -constants "$C" || true
          done
