name: Build and test RPG-HUD HC40M 1.0.1

on:
  push:
    paths:
      - ".github/workflows/build-rpghud-hc40m-101.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Download exact upstream RPG-HUD 3.13
        shell: bash
        run: |
          mkdir -p sources/rpghud-hc40m-fix/libs
          curl -L --fail --retry 3             'https://cdn.modrinth.com/data/EC41AOIq/versions/MBR7kJNW/%5B1.21.11%5D%5BFabric%5D%20RPG-HUD-3.13.jar'             -o sources/rpghud-hc40m-fix/libs/rpg-hud-base.jar
          echo 'ab2dec0daf697af037c294c50ba7a8dc5251048294d5f88229bc14d832a02b00  sources/rpghud-hc40m-fix/libs/rpg-hud-base.jar' | sha256sum -c -

      - name: Compile real Fabric Mixin with Loom
        working-directory: sources/rpghud-hc40m-fix
        run: gradle clean build --stacktrace

      - name: Verify compiled class really contains @Mixin
        working-directory: sources/rpghud-hc40m-fix
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name 'HauteCapitale-RPGHUD-HC40M-Fix-1.0.1.jar' | head -n1)
          test -f "$JAR"
          mkdir -p /tmp/hcclockclass
          cd /tmp/hcclockclass
          jar xf "$GITHUB_WORKSPACE/sources/rpghud-hc40m-fix/$JAR" fr/hautecapitale/rpghud/mixin/HudElementClockVanillaMixin.class
          javap -v fr/hautecapitale/rpghud/mixin/HudElementClockVanillaMixin.class > /tmp/hcclock-javap.txt
          grep -q 'org.spongepowered.asm.mixin.Mixin' /tmp/hcclock-javap.txt
          grep -q 'org.spongepowered.asm.mixin.injection.Redirect' /tmp/hcclock-javap.txt
          echo 'Compiled Mixin annotations: OK'

      - name: Launch client with upstream RPG-HUD + compiled fix
        working-directory: sources/rpghud-hc40m-fix
        shell: bash
        run: |
          set +e
          timeout 75s xvfb-run -a gradle runClient --stacktrace > /tmp/rpghud-client-test.log 2>&1
          CODE=$?
          set -e

          cat /tmp/rpghud-client-test.log | tail -n 180

          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 124 ]; then
            echo "Client terminated unexpectedly with code $CODE"
            exit "$CODE"
          fi

          if grep -Eqi 'missing an @Mixin annotation|MixinApplyError|InvalidMixinException|InjectionError|InvalidInjectionException|MixinTransformerError|failed preparing .*HudElementClockVanillaMixin' /tmp/rpghud-client-test.log; then
            echo 'HC40M mixin failed during actual client startup'
            exit 1
          fi

          grep -Eq 'Loading Minecraft 1\.21\.11|Minecraft 1\.21\.11' /tmp/rpghud-client-test.log
          echo 'Actual Fabric client startup passed Mixin preparation.'

      - name: Merge tested compiled fix into replacement RPG-HUD
        shell: bash
        run: |
          PATCH=$(find sources/rpghud-hc40m-fix/build/libs -maxdepth 1 -type f -name 'HauteCapitale-RPGHUD-HC40M-Fix-1.0.1.jar' | head -n1)
          test -f "$PATCH"

          python - "$PATCH" <<'PY'
          import json, sys, zipfile
          from pathlib import Path

          patch = Path(sys.argv[1])
          base = Path("sources/rpghud-hc40m-fix/libs/rpg-hud-base.jar")
          out = Path("/tmp/RPG-HUD-3.13-HauteCapitale-HC40M-1.0.1.jar")

          class_name = "fr/hautecapitale/rpghud/mixin/HudElementClockVanillaMixin.class"
          cfg_name = "hc_rpghud_hc40m_fix.mixins.json"

          with zipfile.ZipFile(base) as zin, zipfile.ZipFile(patch) as zp:
              fabric = json.loads(zin.read("fabric.mod.json").decode("utf-8"))
              fabric["version"] = "3.13+hc40m.2"
              fabric["name"] = "RPG-Hud — Haute Capitale"
              fabric["description"] = (
                  fabric.get("description", "")
                  + " Haute Capitale HC40M 1.0.1: compiled clock smoothing fix for the 40-minute day/night cycle."
              )
              mixins = fabric.setdefault("mixins", [])
              if cfg_name not in mixins:
                  mixins.append(cfg_name)

              replacements = {
                  "fabric.mod.json": (json.dumps(fabric, ensure_ascii=False, indent=2) + "\n").encode()
              }
              additions = {
                  class_name: zp.read(class_name),
                  cfg_name: zp.read(cfg_name),
                  "__haute_capitale_meta/HC40M_CLOCK_PATCH_1.0.1.txt": (
                      "RPG-HUD 3.13 Haute Capitale HC40M 1.0.1\n"
                      "Corrective build: genuine Loom-compiled @Mixin class.\n"
                      "Upstream base SHA-256: ab2dec0daf697af037c294c50ba7a8dc5251048294d5f88229bc14d832a02b00\n"
                      "Only the visual RPG-HUD clock is smoothed; no world time is modified.\n"
                  ).encode()
              }

              with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zout:
                  for info in zin.infolist():
                      data = replacements.get(info.filename, zin.read(info.filename))
                      ni = zipfile.ZipInfo(info.filename, info.date_time)
                      ni.compress_type = zipfile.ZIP_DEFLATED
                      ni.external_attr = info.external_attr
                      ni.internal_attr = info.internal_attr
                      ni.create_system = info.create_system
                      ni.comment = info.comment
                      ni.extra = info.extra
                      zout.writestr(ni, data)
                  for name, data in additions.items():
                      ni = zipfile.ZipInfo(name, (2026, 10, 1, 18, 0, 0))
                      ni.compress_type = zipfile.ZIP_DEFLATED
                      ni.external_attr = (0o100644 & 0xFFFF) << 16
                      zout.writestr(ni, data)

          with zipfile.ZipFile(base) as a, zipfile.ZipFile(out) as b:
              assert b.testzip() is None
              base_names, out_names = set(a.namelist()), set(b.namelist())
              assert out_names - base_names == {
                  class_name,
                  cfg_name,
                  "__haute_capitale_meta/HC40M_CLOCK_PATCH_1.0.1.txt",
              }
              changed = [n for n in sorted(base_names) if a.read(n) != b.read(n)]
              assert changed == ["fabric.mod.json"], changed

              f = json.loads(b.read("fabric.mod.json"))
              assert f["version"] == "3.13+hc40m.2"
              assert cfg_name in f["mixins"]
              cfg = json.loads(b.read(cfg_name))
              assert cfg["client"] == ["HudElementClockVanillaMixin"]
          print(out)
          PY

      - name: Publish corrected JAR
        shell: bash
        run: |
          DEST='mods/RPG-HUD-3.13-HauteCapitale-HC40M-1.0.1.jar'
          cp /tmp/RPG-HUD-3.13-HauteCapitale-HC40M-1.0.1.jar "$DEST"
          SHA=$(sha256sum "$DEST" | awk '{print $1}')
          SIZE=$(stat -c%s "$DEST")
          printf '%s  %s\n' "$SHA" "$(basename "$DEST")" > mods/RPG-HUD-3.13-HauteCapitale-HC40M-1.0.1.SHA256.txt

          cat > docs/mods/RPG_HUD_3_13_HC40M_1_0_1_VALIDATION.md <<EOF
          # RPG-HUD 3.13 — Haute Capitale HC40M 1.0.1

          Correctif de la version HC40M 1.0 invalide.

          - JAR : \`$DEST\`
          - Taille : **$SIZE octets**
          - SHA-256 : \`$SHA\`
          - Base RPG-HUD 3.13 vérifiée : \`ab2dec0daf697af037c294c50ba7a8dc5251048294d5f88229bc14d832a02b00\`

          ## Validation

          - classe Mixin compilée réellement avec Fabric Loom ;
          - \`javap -v\` confirme \`@Mixin\` et \`@Redirect\` dans le bytecode ;
          - lancement client Fabric 1.21.11 sous Xvfb avec le RPG-HUD officiel + le correctif ;
          - aucune \`InvalidMixinException\`, \`InjectionError\` ou \`MixinApplyError\` ;
          - JAR final conserve tous les fichiers upstream, sauf \`fabric.mod.json\` ;
          - \`rpg-hud.mixins.json\` upstream reste byte-for-byte intact ;
          - le correctif utilise son propre \`hc_rpghud_hc40m_fix.mixins.json\`.

          Source : \`sources/rpghud-hc40m-fix/\`.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install --local
          git add "$DEST" mods/RPG-HUD-3.13-HauteCapitale-HC40M-1.0.1.SHA256.txt docs/mods/RPG_HUD_3_13_HC40M_1_0_1_VALIDATION.md
          git commit -m "rpghud: publish corrected HC40M 1.0.1 build"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
