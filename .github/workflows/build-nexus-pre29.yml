name: Preserve verified NexusCharacters PRE29
on:
  push:
    branches: [fix/nexus-pre29-clean-labels]
    paths:
      - mods/nexuscharacters/reference/BETA-1.0-PRE29/compiled-patches.zip.b64
      - mods/nexuscharacters/reference/BETA-1.0-PRE29/assemble.py
      - .github/workflows/build-nexus-pre29.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Reproduce the runtime-tested candidate
        run: python mods/nexuscharacters/reference/BETA-1.0-PRE29/assemble.py
      - uses: actions/upload-artifact@v4
        with:
          name: NexusCharacters-PRE29
          path: mods/NexusCharacters-Indivis-1.21.11-BETA-1.0-PRE29.jar
          retention-days: 90
      - name: Preserve downloads
        run: |
          python - <<'PYCODE'
          import zipfile
          from pathlib import Path
          jar=Path('mods/NexusCharacters-Indivis-1.21.11-BETA-1.0-PRE29.jar')
          with zipfile.ZipFile('mods/NexusCharacters-PRE29.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.write(jar,jar.name)
          PYCODE
          git lfs install
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mods/NexusCharacters-Indivis-1.21.11-BETA-1.0-PRE29.jar mods/NexusCharacters-PRE29.zip
          git commit -m 'Store tested PRE29 downloads'
          git push origin HEAD:fix/nexus-pre29-clean-labels
