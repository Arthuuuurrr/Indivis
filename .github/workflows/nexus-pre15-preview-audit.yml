name: Nexus PRE15 preview-path audit

on:
  push:
    paths:
      - ".github/workflows/nexus-pre15-preview-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Inspect preview and renderer paths
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE15.jar"
          curl -fsSL https://www.benf.org/other/cfr/cfr-0.152.jar -o /tmp/cfr.jar
          rm -rf /tmp/d && mkdir -p /tmp/d
          java -jar /tmp/cfr.jar "$J" --outputdir /tmp/d --silent true >/dev/null 2>&1

          echo "=== matching classes ==="
          jar tf "$J" | grep -Ei 'Preview|CosmeticFeatureRenderer|PlayerSkinWidget|RendererMixin|FeatureRenderer' | sort

          for cls in             CharacterPreviewRenderer             CharacterCosmeticFeatureRenderer             PreviewDummyPlayerManager             CharacterCreationScreen; do
            F="/tmp/d/net/tompsen/nexuscharacters/$cls.java"
            if [ -f "$F" ]; then
              echo "===== $cls ====="
              cat "$F"
            fi
          done

          echo "=== all references to CharacterCosmeticFeatureRenderer ==="
          grep -R -n -C 8 'CharacterCosmeticFeatureRenderer' /tmp/d/net/tompsen/nexuscharacters || true

          echo "=== all references to PRE15/LongHair3DRenderSupport ==="
          grep -R -n -C 8 -E 'PRE15|LongHair3DRenderSupport' /tmp/d/net/tompsen/nexuscharacters || true

          echo "=== all PlayerSkinWidget references ==="
          grep -R -n -C 8 'PlayerSkinWidget' /tmp/d/net/tompsen/nexuscharacters || true
