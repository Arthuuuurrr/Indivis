name: Nexus PRE12 renderer inspect

on:
  push:
    paths:
      - ".github/workflows/nexus-pre12-renderer-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Decompile render-related mixins
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE11.jar"
          curl -fsSL https://www.benf.org/other/cfr/cfr-0.152.jar -o /tmp/cfr.jar
          mkdir -p /tmp/d
          for c in             net.tompsen.nexuscharacters.mixin.client.LivingEntityCosmeticRenderMixin             net.tompsen.nexuscharacters.mixin.client.PlayerRenderStateCosmeticMixin             net.tompsen.nexuscharacters.mixin.client.PlayerRenderStateMorphMixin             net.tompsen.nexuscharacters.mixin.client.PlayerPresetSkinMixin             net.tompsen.nexuscharacters.mixin.client.CharacterCreationModularSkinMixin; do
            unzip -p "$J" "${c//.//}.class" >/tmp/x.class
            java -jar /tmp/cfr.jar /tmp/x.class --silent true 2>/dev/null
          done
