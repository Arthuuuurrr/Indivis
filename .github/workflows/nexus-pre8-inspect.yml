name: Inspect Nexus PRE7 console spam

on:
  push:
    paths:
      - ".github/workflows/nexus-pre8-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify PRE7 runtime
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE7.jar"
          test -s "$J"
          unzip -t "$J" >/dev/null
          echo "PRE7 bytes: $(stat -c%s "$J")"
          sha256sum "$J"

      - name: Locate spam emitters
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE7.jar"
          python - <<'PY'
          import zipfile
          from pathlib import Path

          jar = Path("mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE7.jar")
          needles = [
              b"Puffish Skills saved",
              b"Profile scores saved",
              b"before_save_self",
              b"Running function",
          ]
          found = {}
          with zipfile.ZipFile(jar) as z:
              for name in z.namelist():
                  if not name.endswith(".class"):
                      continue
                  data = z.read(name)
                  hits = [n.decode() for n in needles if n in data]
                  if hits:
                      found[name] = hits
          print("=== MATCHING CLASSES ===")
          for name, hits in found.items():
              print(name, "=>", ", ".join(hits))
          if not found:
              raise SystemExit("No spam-related constants found in PRE7")
          Path("/tmp/nexus-spam-classes.txt").write_text(
              "\n".join(name[:-6].replace("/", ".") for name in found) + "\n",
              encoding="utf-8",
          )
          PY

          echo "=== TARGET CLASSES ==="
          cat /tmp/nexus-spam-classes.txt

      - name: Disassemble spam emitters
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE7.jar"
          while IFS= read -r C; do
            echo "===== JAVAP $C ====="
            javap -classpath "$J" -p -c -constants "$C"
          done < /tmp/nexus-spam-classes.txt

      - name: Decompile spam emitters
        shell: bash
        run: |
          J="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE7.jar"
          curl -fsSL https://www.benf.org/other/cfr/cfr-0.152.jar -o /tmp/cfr.jar
          mkdir -p /tmp/classes /tmp/decomp
          python - <<'PY'
          import zipfile
          from pathlib import Path
          jar = Path("mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE7.jar")
          classes = Path("/tmp/nexus-spam-classes.txt").read_text().splitlines()
          with zipfile.ZipFile(jar) as z:
              for cls in classes:
                  entry = cls.replace(".", "/") + ".class"
                  out = Path("/tmp/classes") / Path(entry).name
                  out.write_bytes(z.read(entry))
          PY
          for C in /tmp/classes/*.class; do
            echo "===== CFR $(basename "$C") ====="
            rm -rf /tmp/decomp/*
            java -jar /tmp/cfr.jar "$C" --outputdir /tmp/decomp --silent true || true
            find /tmp/decomp -name '*.java' -type f -maxdepth 10 -print -exec cat {} \;
          done

# inspection trigger
