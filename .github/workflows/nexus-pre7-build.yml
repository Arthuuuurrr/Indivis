name: Build Nexus BETA 1.0 PRE7

on:
  push:
    paths:
      - "mods/nexuscharacters/reference/BETA-1.0-PRE7/**"
      - ".github/workflows/nexus-pre7-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Reconstruct PRE5 base
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json
          root = Path("mods/nexuscharacters/releases/BETA-1.0-PRE5/parts")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          encoded = "".join(
              "".join((root / name).read_text(encoding="ascii").split())
              for name in manifest["parts"]
          )
          data = base64.b64decode(encoded, validate=True)
          sha = hashlib.sha256(data).hexdigest()
          if sha != manifest["artifact_sha256"]:
              raise SystemExit(f"PRE5 SHA mismatch: {sha}")
          Path("/tmp/nexus-pre5.jar").write_bytes(data)
          print("PRE5", len(data), sha)
          PY
          unzip -t /tmp/nexus-pre5.jar >/dev/null

      - name: Compile PRE7 targeted classes
        shell: bash
        run: |
          mkdir -p /tmp/pre7-classes
          javac -cp /tmp/nexus-pre5.jar             -d /tmp/pre7-classes             mods/nexuscharacters/reference/BETA-1.0-PRE7/sources/LongBeardModelSupport.java             mods/nexuscharacters/reference/BETA-1.0-PRE7/sources/UnifiedPilositySupport.java
          test -f /tmp/pre7-classes/net/tompsen/nexuscharacters/LongBeardModelSupport.class
          test -f /tmp/pre7-classes/net/tompsen/nexuscharacters/UnifiedPilositySupport.class

      - name: Assemble PRE7
        shell: bash
        run: |
          OUT="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE7.jar"
          cp /tmp/nexus-pre5.jar "$OUT"

          # PRE7 beard geometry + dwarf selector enforcement.
          jar uf "$OUT" -C /tmp/pre7-classes net/tompsen/nexuscharacters/LongBeardModelSupport.class
          jar uf "$OUT" -C /tmp/pre7-classes net/tompsen/nexuscharacters/UnifiedPilositySupport.class

          # Retain PRE6's minimal layout fix, without touching its responsive math.
          mkdir -p /tmp/pre7-layout/net/tompsen/nexuscharacters/mixin/client
          unzip -p "$OUT"             net/tompsen/nexuscharacters/mixin/client/CharacterCreationAppearance65Mixin.class             > /tmp/pre7-layout/net/tompsen/nexuscharacters/mixin/client/CharacterCreationAppearance65Mixin.class
          python mods/nexuscharacters/reference/BETA-1.0-PRE6/tools/patch_pre6_layout.py             /tmp/pre7-layout/net/tompsen/nexuscharacters/mixin/client/CharacterCreationAppearance65Mixin.class
          jar uf "$OUT" -C /tmp/pre7-layout             net/tompsen/nexuscharacters/mixin/client/CharacterCreationAppearance65Mixin.class

          mkdir -p /tmp/pre7-meta
          unzip -p "$OUT" fabric.mod.json > /tmp/pre7-meta/fabric.mod.json
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path("/tmp/pre7-meta/fabric.mod.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["version"] = "1.0.0-beta.7+hc.1.21.11"
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          jar uf "$OUT" -C /tmp/pre7-meta fabric.mod.json

      - name: Validate PRE7
        shell: bash
        run: |
          OUT="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE7.jar"
          unzip -t "$OUT" >/dev/null

          python - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile

          base = Path("/tmp/nexus-pre5.jar")
          out = Path("mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE7.jar")

          with zipfile.ZipFile(base) as z0, zipfile.ZipFile(out) as z1:
              n0 = z0.namelist()
              n1 = z1.namelist()
              if len(n1) != len(set(n1)):
                  dup = sorted({n for n in n1 if n1.count(n) > 1})
                  raise SystemExit(f"Duplicate ZIP entries: {dup}")
              if set(n0) != set(n1):
                  raise SystemExit("PRE7 changed the JAR entry set")

              expected = {
                  "net/tompsen/nexuscharacters/LongBeardModelSupport.class",
                  "net/tompsen/nexuscharacters/UnifiedPilositySupport.class",
                  "net/tompsen/nexuscharacters/mixin/client/CharacterCreationAppearance65Mixin.class",
                  "fabric.mod.json",
              }
              changed = {
                  name for name in n0
                  if hashlib.sha256(z0.read(name)).digest() != hashlib.sha256(z1.read(name)).digest()
              }
              if changed != expected:
                  raise SystemExit(f"Unexpected changed entries: {sorted(changed)}")

              mod = json.loads(z1.read("fabric.mod.json"))
              if mod.get("version") != "1.0.0-beta.7+hc.1.21.11":
                  raise SystemExit(f"Wrong fabric.mod.json version: {mod.get('version')}")

              layout = z1.read("net/tompsen/nexuscharacters/mixin/client/CharacterCreationAppearance65Mixin.class")
              for required in (b"Oreilles", b"Ornement"):
                  if required not in layout:
                      raise SystemExit(f"Missing retained PRE6 layout prefix: {required!r}")

              unified = z1.read("net/tompsen/nexuscharacters/UnifiedPilositySupport.class")
              if b"DWARF_3D" not in unified:
                  raise SystemExit("Dwarf beard sequence missing from UnifiedPilositySupport")

          raw = out.read_bytes()
          sha = hashlib.sha256(raw).hexdigest()
          size = len(raw)
          print("PRE7", size, sha)

          ref = Path("mods/nexuscharacters/reference/BETA-1.0-PRE7")
          (ref / "SHA256SUMS.txt").write_text(
              f"{sha}  {out.name}\n", encoding="utf-8"
          )
          (ref / "VALIDATION.md").write_text(
              "# Validation BETA 1.0 PRE7\n\n"
              f"- JAR : `{out.name}`\n"
              f"- Taille : **{size} octets**\n"
              f"- SHA-256 : `{sha}`\n"
              "- Base : PRE5 reconstruite et SHA vérifié.\n"
              "- Correctif layout PRE6 réappliqué sans changement de calcul responsive.\n"
              "- Archive ZIP/JAR : OK.\n"
              "- Aucun doublon d'entrée ZIP.\n"
              "- Ensemble des entrées identique à PRE5.\n"
              "- Entrées modifiées uniquement : `LongBeardModelSupport.class`, "
              "`UnifiedPilositySupport.class`, "
              "`CharacterCreationAppearance65Mixin.class`, `fabric.mod.json`.\n"
              "- Version : `1.0.0-beta.7+hc.1.21.11`.\n"
              "- Barbe ajourée : raccord du bouc renforcé.\n"
              "- Nain : état sans pilosité supprimé du cycle et réparé vers la première barbe.\n"
              "- Défilement des libellés : inchangé.\n",
              encoding="utf-8"
          )
          PY

          echo "=== PRE7 relevant constants ==="
          javap -classpath "$OUT" -p -c -constants             net.tompsen.nexuscharacters.UnifiedPilositySupport             | grep -E 'DWARF_3D|none|short' | head -n 60 || true

      - name: Publish PRE7 through Git LFS
        shell: bash
        run: |
          git lfs install --local
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep only the current Nexus runtime in mods/.
          git rm -f --ignore-unmatch mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE6.jar
          git add             mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE7.jar             mods/nexuscharacters/reference/BETA-1.0-PRE7/SHA256SUMS.txt             mods/nexuscharacters/reference/BETA-1.0-PRE7/VALIDATION.md

          if git diff --cached --quiet; then
            echo "No PRE7 artifacts to commit."
            exit 0
          fi

          git commit -m "nexus: publish BETA 1.0 PRE7"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
