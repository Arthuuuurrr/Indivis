name: Indivis Project REST Repair Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/indivis-project-rest-repair-test.yml"

permissions:
  contents: read
  issues: read

jobs:
  test-rest-project-index:
    runs-on: ubuntu-latest
    env:
      PROJECT_TOKEN: ${{ secrets.INDIVIS_PROJECT_TOKEN }}

    steps:
      - name: Test REST reindex path on issue 83
        shell: bash
        run: |
          set -euo pipefail

          OWNER="Arthuuuurrr"
          REPO="Indivis"
          PROJECT_NUMBER="1"
          ISSUE_NUMBER="83"

          api() {
            GH_TOKEN="${PROJECT_TOKEN}" gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" "$@"
          }

          gql() {
            GH_TOKEN="${PROJECT_TOKEN}" gh api graphql "$@"
          }

          issue_json="$(api "repos/${OWNER}/${REPO}/issues/${ISSUE_NUMBER}")"
          issue_rest_id="$(jq -r '.id' <<<"$issue_json")"

          project_json="$(gql \
            -f query='query($login:String!,$number:Int!){user(login:$login){projectV2(number:$number){id}}}' \
            -f login="${OWNER}" -F number="${PROJECT_NUMBER}")"
          project_node_id="$(jq -r '.data.user.projectV2.id' <<<"$project_json")"

          reverse_json="$(gql \
            -f query='
              query($owner:String!,$repo:String!,$number:Int!){
                repository(owner:$owner,name:$repo){
                  issue(number:$number){
                    projectItems(first:20,includeArchived:true){
                      nodes{id isArchived project{id}}
                    }
                  }
                }
              }' \
            -f owner="${OWNER}" -f repo="${REPO}" -F number="${ISSUE_NUMBER}")"

          ghost_item_id="$(jq -r --arg project "$project_node_id" '
            .data.repository.issue.projectItems.nodes[]
            | select(.project.id == $project and .isArchived == false)
            | .id
          ' <<<"$reverse_json" | head -n1)"

          echo "Issue REST id: $issue_rest_id"
          echo "Existing reverse item: ${ghost_item_id:-none}"

          if [[ -n "${ghost_item_id:-}" && "$ghost_item_id" != "null" ]]; then
            echo "Deleting current invisible Project item for #${ISSUE_NUMBER}"
            gql \
              -f query='mutation($project:ID!,$item:ID!){deleteProjectV2Item(input:{projectId:$project,itemId:$item}){deletedItemId}}' \
              -f project="$project_node_id" \
              -f item="$ghost_item_id" >/dev/null
            sleep 2
          fi

          echo "Adding #${ISSUE_NUMBER} through REST Projects API"
          add_json="$(jq -nc --argjson id "$issue_rest_id" '{type:"Issue",id:$id}' | \
            api --method POST "users/${OWNER}/projectsV2/${PROJECT_NUMBER}/items" --input -)"
          echo "$add_json" | jq '{id:.value.id,node_id:.value.node_id,content_type:.value.content_type,title:.value.content.title}'

          sleep 3

          list_json="$(api "users/${OWNER}/projectsV2/${PROJECT_NUMBER}/items?per_page=100")"
          echo "REST list response type: $(jq -r 'type' <<<"$list_json")"
          echo "REST visible item count: $(jq -r 'length' <<<"$list_json")"

          visible="$(jq -r --argjson id "$issue_rest_id" '
            [.[] | select(.content.id == $id)] | length
          ' <<<"$list_json")"
          echo "Issue #${ISSUE_NUMBER} visible in REST forward index: $visible"

          if [[ "$visible" != "1" ]]; then
            echo "::error::REST reinsert did not repair the Project forward index."
            exit 1
          fi

          echo "REST_REPAIR_TEST=PASS"
