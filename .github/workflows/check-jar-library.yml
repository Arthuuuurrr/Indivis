name: Check JAR library

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'artifacts/jars/**'
      - 'tools/check_jar_duplicates.py'
      - '.gitattributes'
      - '.github/workflows/check-jar-library.yml'
  push:
    branches:
      - main
    paths:
      - 'artifacts/jars/**'
      - 'tools/check_jar_duplicates.py'
      - '.gitattributes'
      - '.github/workflows/check-jar-library.yml'

jobs:
  validate-jars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify LFS binaries are materialized
        shell: bash
        run: |
          set -euo pipefail

          count=0
          failed=0

          while IFS= read -r -d '' jar; do
            count=$((count + 1))
            size="$(stat -c '%s' "$jar")"
            magic="$(head -c 2 "$jar" | od -An -tx1 | tr -d ' \n')"

            echo "$jar | $size bytes | magic=$magic"

            if (( size < 1024 )); then
              echo "::error file=$jar::JAR is still an LFS pointer or otherwise too small ($size bytes)"
              failed=1
            fi

            if [[ "$magic" != "504b" ]]; then
              echo "::error file=$jar::JAR does not start with ZIP/JAR magic PK"
              failed=1
            fi
          done < <(find artifacts/jars -type f -name '*.jar' -print0)

          echo "Validated JAR count: $count"

          if (( count == 0 )); then
            echo "::error::No JAR found in artifacts/jars"
            exit 1
          fi

          if (( failed != 0 )); then
            exit 1
          fi

      - name: Check exact duplicate JARs
        run: python tools/check_jar_duplicates.py
