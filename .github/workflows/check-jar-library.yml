name: Check JAR library

on:
  pull_request:
    paths:
      - 'artifacts/jars/**'
      - 'tools/check_jar_duplicates.py'
      - '.gitattributes'
  push:
    branches:
      - main
    paths:
      - 'artifacts/jars/**'
      - 'tools/check_jar_duplicates.py'

jobs:
  duplicates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Check exact duplicate JARs
        run: python tools/check_jar_duplicates.py
