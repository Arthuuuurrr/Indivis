name: Build Nexus BETA 1.0 PRE17

on:
  push:
    paths:
      - "mods/nexuscharacters/reference/BETA-1.0-PRE17/**"
      - ".github/workflows/nexus-pre17-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact PRE16 base
        shell: bash
        run: |
          BASE="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE16.jar"
          test -s "$BASE"
          unzip -t "$BASE" >/dev/null
          echo "59e85a002bc03ed5c251f8531e0667474fd5f92894ebd3f27e14529666ecb44a  $BASE" | sha256sum -c -

      - name: Compile PRE17 body-anchor fix
        shell: bash
        run: |
          BASE="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE16.jar"
          mkdir -p /tmp/pre17-classes
          javac -cp "$BASE" -d /tmp/pre17-classes             mods/nexuscharacters/reference/BETA-1.0-PRE17/sources/LongHair3DRenderSupport.java

          test -f /tmp/pre17-classes/net/tompsen/nexuscharacters/LongHair3DRenderSupport.class
          test "$(find /tmp/pre17-classes/net/tompsen/nexuscharacters -type f -name '*.class' | wc -l)" -eq 1

      - name: Assemble PRE17
        shell: bash
        run: |
          BASE="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE16.jar"
          OUT="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE17.jar"
          cp "$BASE" "$OUT"
          jar uf "$OUT" -C /tmp/pre17-classes net/tompsen/nexuscharacters/LongHair3DRenderSupport.class

          mkdir -p /tmp/pre17-meta
          unzip -p "$OUT" fabric.mod.json > /tmp/pre17-meta/fabric.mod.json
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("/tmp/pre17-meta/fabric.mod.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          data["version"]="1.0.0-beta.17+hc.1.21.11"
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          jar uf "$OUT" -C /tmp/pre17-meta fabric.mod.json
          unzip -t "$OUT" >/dev/null

      - name: Verify 1.21.11 field mappings and exact preview render path
        shell: bash
        run: |
          # Exact Yarn mapping snapshot currently used for 1.21.11 names.
          curl -fsSL             "https://raw.githubusercontent.com/FabricMC/yarn/ee98590897c919286b96b7c7f2c89ae4ac737762/mappings/net/minecraft/client/render/entity/model/BipedEntityModel.mapping"             -o /tmp/biped.mapping
          grep -F $'FIELD field_3391 body Lnet/minecraft/class_630;' /tmp/biped.mapping
          grep -F $'FIELD field_3394 hat Lnet/minecraft/class_630;' /tmp/biped.mapping

          curl -fsSL             "https://raw.githubusercontent.com/FabricMC/yarn/ee98590897c919286b96b7c7f2c89ae4ac737762/mappings/net/minecraft/client/gui/widget/PlayerSkinWidget.mapping"             -o /tmp/widget.mapping
          grep -F $'FIELD field_59834 wideModel Lnet/minecraft/class_591;' /tmp/widget.mapping
          grep -F $'FIELD field_59835 slimModel Lnet/minecraft/class_591;' /tmp/widget.mapping

          # Exact 1.21.11 decompiled widget source: the widget submits its stored
          # PlayerModel directly, so injected ModelPart meshes survive to rendering.
          curl -fsSL             "https://raw.githubusercontent.com/rrrRex1024/minecraft-1-21-11-source/fb136698ca0ae1f6e6e5a1b0c964740fb2f6dd18/net/minecraft/client/gui/components/PlayerSkinWidget.java"             -o /tmp/PlayerSkinWidget.java
          grep -F 'PlayerModel model = skin.model() == PlayerModelType.SLIM ? this.slimModel : this.wideModel;' /tmp/PlayerSkinWidget.java
          grep -F 'graphics.submitSkinRenderState(model, skin.body().texturePath()' /tmp/PlayerSkinWidget.java

          # Exact Skin Layers 1.10.2 source commit: injected meshes replace the
          # flat ModelPart geometry and apply the configured OffsetProvider.
          curl -fsSL             "https://raw.githubusercontent.com/tr7zw/3d-Skin-Layers/0f813f9e21367fc1eef0b04ca8de3113b2cc22ff/src/main/java/dev/tr7zw/skinlayers/mixin/ModelPartMixin.java"             -o /tmp/ModelPartMixin.java
          grep -F 'if (visible && injectedMesh != null)' /tmp/ModelPartMixin.java
          grep -F 'offsetProvider.applyOffset(poseStack, injectedMesh);' /tmp/ModelPartMixin.java
          grep -F 'ci.cancel();' /tmp/ModelPartMixin.java

      - name: Verify exact Skin Layers 1.10.2 binary API
        shell: bash
        run: |
          curl -fL --retry 3             "https://github.com/tr7zw/3d-Skin-Layers/releases/download/1.10.2/skinlayers3d-fabric-1.10.2-mc1.21.11.jar"             -o /tmp/skinlayers.jar
          echo "736f076b9f45bab1c118166857f46729f782ddd481a0e4e4ee0bc110643f2756  /tmp/skinlayers.jar" | sha256sum -c -

          javap -classpath /tmp/skinlayers.jar -p -s dev.tr7zw.skinlayers.SkinUtil             | grep -F 'getTexture(net.minecraft.class_2960, dev.tr7zw.skinlayers.accessor.SkullSettings)'
          javap -classpath /tmp/skinlayers.jar -p dev.tr7zw.skinlayers.api.MeshHelper             | grep -F 'create3DMesh'
          javap -classpath /tmp/skinlayers.jar -p dev.tr7zw.skinlayers.accessor.ModelPartInjector             | grep -F 'setInjectedMesh'

      - name: Exhaustive hair texture topology audit
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          OUT="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE17.jar"
          rm -rf /tmp/pre17-assets && mkdir -p /tmp/pre17-assets
          cd /tmp/pre17-assets
          jar xf "$GITHUB_WORKSPACE/$OUT"

          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          root=Path("/tmp/pre17-assets/assets/nexuscharacters/textures/cosmetic/hair_3d")
          body_styles=[]
          for i in range(1,14):
              p=root/f"hair_{i:02d}.png"
              im=Image.open(p).convert("RGBA")
              assert im.size==(64,64), (i,im.size)
              a=im.getchannel("A")
              head=sum(1 for y in range(0,16) for x in range(32,64) if a.getpixel((x,y))>0)
              body=sum(1 for y in range(32,48) for x in range(16,40) if a.getpixel((x,y))>0)
              assert head>0, f"h{i:02d}: no head alpha"
              if body: body_styles.append(i)
              print(f"h{i:02d}: head={head} body={body} bbox={a.getbbox()}")

          assert body_styles==[6,7,8,9,10], body_styles
          print("BODY_STYLES_OK",body_styles)

          tinted=Path("/tmp/pre17-assets/assets/nexuscharacters/textures/cosmetic/hair_3d_tinted")
          checked=0
          v69=0
          legacy=0
          for p in tinted.rglob("hair_*.png"):
              im=Image.open(p).convert("RGBA")
              assert im.size==(64,64), (p,im.size)
              i=int(p.stem.split("_")[1])
              base=Image.open(root/f"hair_{i:02d}.png").convert("RGBA")
              assert bytes(im.getchannel("A").tobytes()) == bytes(base.getchannel("A").tobytes()), p
              checked += 1
              if "/v69/" in p.as_posix(): v69 += 1
              if "/legacy/" in p.as_posix(): legacy += 1

          assert checked==247, checked
          assert v69==156, v69
          assert legacy==91, legacy
          print("TINTED_ALPHA_OK",checked,"v69",v69,"legacy",legacy)
          PY

      - name: Verify PRE17 bytecode anchor and PRE16 worldless preservation
        shell: bash
        run: |
          BASE="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE16.jar"
          OUT="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE17.jar"

          javap -classpath "$OUT" -p -c -verbose net.tompsen.nexuscharacters.LongHair3DRenderSupport > /tmp/pre17-long.txt
          grep -F 'String field_3391' /tmp/pre17-long.txt
          # The old normal-render BODY anchor must be absent from the patched class.
          if grep -Fq 'String field_3394' /tmp/pre17-long.txt; then
            echo "Old HAT anchor field_3394 is still present in LongHair3DRenderSupport"
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile

          base=Path("mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE16.jar")
          out=Path("mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE17.jar")
          with zipfile.ZipFile(base) as z0, zipfile.ZipFile(out) as z1:
              n0=set(z0.namelist()); n1=set(z1.namelist())
              assert n0==n1, (sorted(n1-n0),sorted(n0-n1))
              changed={
                  n for n in n0
                  if hashlib.sha256(z0.read(n)).digest()!=hashlib.sha256(z1.read(n)).digest()
              }
              expected={
                  "net/tompsen/nexuscharacters/LongHair3DRenderSupport.class",
                  "fabric.mod.json",
              }
              assert changed==expected, sorted(changed)

              # PRE16 worldless fix remains byte-identical.
              for name in (
                  "net/tompsen/nexuscharacters/WorldlessSkinLayersPreviewSupport.class",
                  "net/tompsen/nexuscharacters/WorldlessHairWidgetRenderer.class",
                  "net/tompsen/nexuscharacters/BeardPreviewVisibilitySupport.class",
                  "net/tompsen/nexuscharacters/WorldlessCosmeticPreview.class",
                  "net/tompsen/nexuscharacters/WorldlessBeardWidgetRenderer.class",
                  "net/tompsen/nexuscharacters/CharacterPreviewRenderer.class",
                  "net/tompsen/nexuscharacters/DynamicAppearanceSupport.class",
                  "net/tompsen/nexuscharacters/UnifiedPilositySupport.class",
                  "net/tompsen/nexuscharacters/ProfileStateBridge.class",
                  "net/tompsen/nexuscharacters/PuffishSkillsBridge.class",
              ):
                  assert hashlib.sha256(z0.read(name)).digest()==hashlib.sha256(z1.read(name)).digest(), name

              # Every hair asset remains byte-identical.
              for name in n0:
                  if name.startswith("assets/nexuscharacters/appearance_parts_v064/hair/")                      or name.startswith("assets/nexuscharacters/textures/cosmetic/hair_3d"):
                      assert hashlib.sha256(z0.read(name)).digest()==hashlib.sha256(z1.read(name)).digest(), name

              mod=json.loads(z1.read("fabric.mod.json"))
              assert mod["version"]=="1.0.0-beta.17+hc.1.21.11"

          print("REGRESSION_SCOPE_OK")
          PY

      - name: Generate PRE17 validation manifest
        shell: bash
        run: |
          OUT="mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE17.jar"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          out=Path("mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE17.jar")
          sha=hashlib.sha256(out.read_bytes()).hexdigest()
          size=out.stat().st_size
          ref=Path("mods/nexuscharacters/reference/BETA-1.0-PRE17")
          (ref/"SHA256SUMS.txt").write_text(f"{sha}  {out.name}\n",encoding="utf-8")
          (ref/"VALIDATION.md").write_text(
              "# Validation BETA 1.0 PRE17\n\n"
              f"- JAR : `{out.name}`\n"
              f"- Taille : **{size} octets**\n"
              f"- SHA-256 : `{sha}`\n"
              "- Base PRE16 : SHA exact vérifié.\n"
              "- PRE16 worldless preview : classes byte-identiques.\n"
              "- Mappings 1.21.11 : field_3391=body, field_3394=hat vérifiés.\n"
              "- PlayerSkinWidget 1.21.11 : soumet directement le PlayerModel stocké.\n"
              "- Skin Layers 1.10.2 : ModelPart injecté applique OffsetProvider puis remplace la géométrie plate.\n"
              "- Coiffures BODY détectées : 6, 7, 8, 9, 10 uniquement.\n"
              "- 247 textures teintées : dimensions et alpha identiques aux bases ; v69=156, legacy=91.\n"
              "- PRE17 : LongHair3DRenderSupport utilise field_3391 et ne contient plus field_3394.\n"
              "- Portée du patch : LongHair3DRenderSupport.class + fabric.mod.json uniquement.\n"
              "- Version : `1.0.0-beta.17+hc.1.21.11`.\n",
              encoding="utf-8"
          )
          print("PRE17",size,sha)
          PY

      - name: Publish PRE17 through Git LFS
        shell: bash
        run: |
          git lfs install --local
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f --ignore-unmatch             mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE16.jar             .github/workflows/nexus-pre16-deep-audit.yml

          git add             mods/NexusCharacters-HauteCapitale-1.21.11-BETA-1.0-PRE17.jar             mods/nexuscharacters/reference/BETA-1.0-PRE17

          git commit -m "nexus: publish BETA 1.0 PRE17 after deep render audit"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
